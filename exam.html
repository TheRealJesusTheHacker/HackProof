<style>
:root{
  --bg:#060a07; --bg2:#0a120b; --card:#0c130d; --line:#1e3323;
  --purple:#1e7a3c; --purple2:#14532d; --neon:#2ee06f; --dim:#9db3a4;
  --ink:#e8f2ea; --good:#34d399; --bad:#f87171; --gold:#fbbf24;
  --radius:14px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:radial-gradient(1200px 600px at 50% -10%, #0c130d 0%, var(--bg) 55%) fixed, var(--bg);
  color:var(--ink); font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  line-height:1.55; min-height:100vh;
}
.wrap{max-width:720px;margin:0 auto;padding:20px 16px 64px}
header.brand{display:flex;align-items:center;gap:12px;margin:6px 0 18px}
.brand .logo{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:24px;
  background:linear-gradient(135deg,var(--purple2),#14532d);box-shadow:0 0 24px #1e7a3c66}
.brand h1{font-size:20px;margin:0;letter-spacing:.06em}
.brand h1 .hp{color:var(--neon)}
.brand small{display:block;color:var(--dim);font-size:12px;letter-spacing:.14em}
.card{background:linear-gradient(180deg,var(--card),var(--bg2));border:1px solid var(--line);
  border-radius:var(--radius);padding:22px 18px;margin:0 0 16px;box-shadow:0 8px 30px #0008}
.card h2{margin:0 0 10px;font-size:22px;letter-spacing:.02em}
.card h2 .accent{color:var(--neon)}
p.lead{color:var(--dim);margin:6px 0 14px}
label.field{display:block;margin:14px 0 4px;font-size:13px;letter-spacing:.08em;color:var(--neon);text-transform:uppercase}
input[type=text],input[type=email],textarea{
  width:100%;background:#060a07;border:1px solid var(--line);border-radius:10px;color:var(--ink);
  padding:14px;font-size:17px;font-family:inherit;outline:none}
input[type=text]:focus,input[type=email]:focus,textarea:focus{border-color:var(--purple);box-shadow:0 0 0 3px #1e7a3c33}
textarea{min-height:110px;resize:vertical;font-size:14px;line-height:1.5}
.hint{font-size:13px;color:var(--dim);margin:6px 0 0}
.err{display:none;background:#3b0d1a;border:1px solid #7f1d2e;color:#fecaca;border-radius:10px;
  padding:12px 14px;margin:12px 0;font-size:14px}
.err.show{display:block}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:16px;font-size:17px;font-weight:800;
  letter-spacing:.04em;cursor:pointer;margin:14px 0 0;font-family:inherit}
.btn.primary{background:linear-gradient(135deg,var(--purple),var(--purple2));color:#fff;
  box-shadow:0 6px 24px #1e7a3c55}
.btn.primary:active{transform:translateY(1px)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--neon)}
.btn.small{width:auto;display:inline-block;padding:10px 18px;font-size:14px;margin:8px 8px 0 0}
.btn:disabled{opacity:.45;cursor:not-allowed}
.progress{height:10px;background:#0c130d;border-radius:99px;overflow:hidden;margin:10px 0 4px;border:1px solid var(--line)}
.progress>div{height:100%;background:linear-gradient(90deg,var(--purple2),var(--neon));width:0%;transition:width .25s}
.qmeta{display:flex;justify-content:space-between;align-items:baseline;color:var(--dim);font-size:13px;letter-spacing:.08em;margin-bottom:8px}
.qtext{font-size:19px;font-weight:650;margin:10px 0 16px;line-height:1.5}
.opt{display:block;width:100%;text-align:left;background:#060a07;border:1px solid var(--line);
  color:var(--ink);border-radius:12px;padding:14px 16px;font-size:16px;margin:10px 0;cursor:pointer;font-family:inherit;line-height:1.45}
.opt:hover{border-color:var(--purple)}
.opt.picked{border-color:var(--purple);background:#111a12;box-shadow:0 0 0 2px #1e7a3c44}
.opt .k{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:8px;background:#0c130d;
  color:var(--neon);font-weight:800;font-size:13px;margin-right:10px;vertical-align:middle}
.examnav{display:flex;gap:10px;margin-top:6px}
.examnav .btn{margin:0}
.grid90{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:14px 0}
.grid90 button{aspect-ratio:1;border-radius:10px;border:1px solid var(--line);background:#060a07;color:var(--dim);
  font-weight:700;font-size:14px;cursor:pointer;font-family:inherit}
.grid90 button.done{background:#14532d;color:var(--neon);border-color:var(--purple2)}
.grid90 button.cur{box-shadow:0 0 0 2px var(--neon)}
.score-big{font-size:56px;font-weight:900;letter-spacing:.02em;margin:6px 0}
.score-big.pass{color:var(--good);text-shadow:0 0 30px #34d39966}
.score-big.fail{color:var(--bad);text-shadow:0 0 30px #f8717166}
.verdict{font-size:15px;letter-spacing:.18em;font-weight:800;margin:4px 0 10px}
.verdict.pass{color:var(--good)} .verdict.fail{color:var(--bad)}
.review-item{border:1px solid var(--line);border-radius:12px;padding:14px;margin:12px 0;background:#060a07}
.review-item .rq{font-weight:650;margin-bottom:8px}
.review-item .ra{font-size:14px;margin:4px 0}
.review-item .ra.yours{color:var(--bad)} .review-item .ra.right{color:var(--good)}
.review-item .why{font-size:14px;color:var(--dim);border-top:1px dashed var(--line);padding-top:8px;margin-top:8px}
/* certificate */
.cert-shell{background:#060a07;border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin:14px 0}
.cert{
  background:linear-gradient(180deg,#fdfbf7,#f5efe4);color:#0c130d;border-radius:8px;
  padding:34px 26px;text-align:center;position:relative;overflow:hidden;
  border:10px double #14532d;
}
.cert::before{content:"";position:absolute;inset:14px;border:1px solid #1e7a3caa;pointer-events:none}
.cert .org{font-size:13px;letter-spacing:.34em;color:#14532d;font-weight:800}
.cert h3{font-size:30px;margin:10px 0 2px;color:#0c130d;letter-spacing:.02em}
.cert .sub{font-size:14px;color:#2f4536;margin:0 0 18px}
.cert .label{font-size:12px;letter-spacing:.28em;color:#2f4536;text-transform:uppercase;margin:14px 0 2px}
.cert .name{font-size:34px;font-weight:800;color:#0c130d;font-family:Georgia,"Times New Roman",serif;margin:2px 0 6px;word-wrap:break-word}
.cert .rule{width:60%;margin:6px auto;border:0;border-top:2px solid #14532d55}
.cert .details{font-size:15px;color:#2f4536;margin:8px 0}
.cert .details b{color:#0c130d}
.cert .cid{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:15px;letter-spacing:.1em;color:#14532d;font-weight:700}
.cert .sealrow{display:flex;justify-content:space-between;align-items:flex-end;margin:26px 6px 0;text-align:left}
.cert .sig{font-size:13px;color:#2f4536}
.cert .sig .line{border-top:1px solid #14532d;margin-top:26px;padding-top:4px;font-size:12px}
.cert .badge{display:inline-block;background:#14532d;color:#fff;font-size:11px;font-weight:800;letter-spacing:.14em;
  border-radius:99px;padding:6px 14px;margin-top:10px}
.codebox{background:#060a07;border:1px dashed var(--purple2);border-radius:10px;padding:12px;margin:12px 0}
.codebox textarea{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;min-height:96px;word-break:break-all}
footer.site{color:var(--dim);font-size:13px;text-align:center;margin:34px 0 10px}
footer.site a{color:var(--neon)}
a{color:var(--neon)}
.hidden{display:none!important}

}
</style>

<script>
"use strict";
/* HackProof Final Exam — 90-question bank.
   m = course module number (1-19). o = options, a = correct option index, why = explanation shown on review. */
var QUESTIONS = [
/* ============ MODULE 1 — Passwords & MFA ============ */
{m:1,q:"An attacker takes your email and password from a breached recipe forum and automatically tries the same pair on your bank, your email, and major shopping sites. What is this attack called?",
o:["Credential stuffing","A brute-force attack on the bank's servers","A SIM-swap attack","A man-in-the-middle attack"],a:0,
why:"Credential stuffing = trying stolen username/password pairs on many sites. It works because people reuse passwords — which is why every account needs a unique password."},
{m:1,q:"Which of these multi-factor authentication methods CANNOT be defeated by a scammer calling your phone carrier and moving your number to their SIM (a SIM swap)?",
o:["Texted (SMS) verification codes","An authenticator app (Google/Microsoft Authenticator, 2FAS)","Codes sent to your voicemail","Security questions about your childhood"],a:1,
why:"Authenticator-app codes are generated on your device and never travel through the phone network, so a SIM swap can't intercept them. SMS codes can be."},
{m:1,q:"You use a password manager with 200 stored passwords. Which password is the single most important one to make long and strong?",
o:["Your email password","Your bank password","Your social media password","Your password manager's master password"],a:3,
why:"The master password guards the vault holding every other password. If it falls, all 200 fall with it — so it gets the strongest one you can remember."},
{m:1,q:"You learn that a forum where you reused your email password was breached. What is the FIRST account you should secure?",
o:["The forum account itself","Your email account","Your streaming service","Your social media account"],a:1,
why:"Your email is the master key: password resets for your bank and nearly everything else flow through it. Secure the email first, then work outward."},
{m:1,q:"After securing a breached email account (new password + MFA), what hidden setting should you check for attacker tampering?",
o:["Your inbox theme and color scheme","Email forwarding rules and filters you didn't create","Your sent folder for typos","Your contact list for duplicates"],a:1,
why:"Attackers routinely create inbox rules that auto-delete security alerts ('your password was changed'), so you never see the warnings. Check filters and forwarding rules for anything you didn't make."},
/* ============ MODULE 2 — Phishing ============ */
{m:2,q:"You get an 'account locked' email that looks like Apple, warning your Apple ID will be deleted. Which detail is the strongest sign it's phishing?",
o:["The email uses the word 'urgent'","The sender address is apple-support@notice-appleid.com — not apple.com","The email includes the Apple logo","The email arrived on a Tuesday"],a:1,
why:"Logos and urgent language are trivially copied. The sender domain is the tell: Apple's real messages come from apple.com. A lookalike domain means it's not Apple."},
{m:2,q:"You receive a text claiming to be your bank: 'Suspicious activity detected. Tap here to verify.' What is the safest response?",
o:["Tap the link and log in to check","Reply asking if it's really your bank","Ignore the text; open your bank's own app (or type its address yourself) and check there","Forward the text to a friend for their opinion"],a:2,
why:"Never trust a link that arrives uninvited. Go to the bank through a channel you chose — its app or a typed address — and verify there. The text is the attacker's chosen battlefield."},
{m:2,q:"An email contains a QR code and says 'scan to verify your account.' Why is this especially dangerous?",
o:["QR codes install viruses automatically","Your phone can't show you where the QR code leads before opening it","QR codes only work on public Wi-Fi","Email QR codes expire after one hour"],a:1,
why:"A QR code hides its destination — you can't hover over it like a link. The scanner just opens whatever URL is encoded, which is usually a pixel-perfect fake login page."},
{m:2,q:"An unexpected email has an attachment named 'Invoice-1042.pdf' — but your email client shows it's actually an HTML file. What should you do?",
o:["Open it — the name says it's a PDF","Open it only on your phone, which is safer","Don't open it. Unexpected attachments — especially ones disguised as another file type — are a classic malware delivery method","Rename it to .pdf and then open it"],a:2,
why:"Attackers disguise malicious files with familiar names. An invoice you weren't expecting, wearing the wrong file type, is a textbook trap. Delete it and verify with the supposed sender through a separate channel."},
{m:2,q:"You clicked a phishing link and entered your password on a fake login page before realizing. What is the correct FIRST step?",
o:["Delete the email and hope for the best","Go to the real site yourself (typed address or app) and change the password immediately","Run a virus scan first, then change the password tomorrow","Email the scammer and ask them to delete your info"],a:1,
why:"Speed matters: the attacker may already be using the password. Change it at the genuine site right away, turn on MFA, and check for tampering (filters, forwarding rules, new logins)."},
/* ============ MODULE 3 — Social Engineering ============ */
{m:3,q:"A 'Microsoft technician' calls, opens Windows Event Viewer on your screen, and points to dozens of red errors as proof you're infected. What's the truth?",
o:["Red errors in Event Viewer always mean an active infection","Event Viewer shows routine warnings on every Windows PC — it's normal noise, not a diagnosis","Only Microsoft employees can read Event Viewer","The errors prove the caller works for Microsoft"],a:1,
why:"Event Viewer logs routine warnings on every healthy PC. Scammers use its scary-looking output as a prop. It proves nothing — and real Microsoft never cold-calls about your computer."},
{m:3,q:"Which statement about tech companies and virus warnings is TRUE?",
o:["Microsoft sometimes calls users about serious infections","Apple shows pop-ups with a phone number for urgent threats","Microsoft, Apple, and your internet provider will NEVER call you or pop up a phone number about a virus","Your ISP will remotely fix your computer if you give them your password"],a:2,
why:"This is absolute: legitimate tech companies do not call users about viruses and do not show pop-ups with support phone numbers. Any call or pop-up doing so is a scam."},
{m:3,q:"A caller has you install remote-access software and is now moving your mouse around. What does this mean?",
o:["They're running a standard diagnostic — let them continue","They've taken control of your computer. Disconnect from the internet immediately and hang up","It means your antivirus is working","Remote access is always safe if the caller sounds professional"],a:1,
why:"Someone moving your cursor is someone inside your machine — they can open your bank, install malware, and steal files. Cut the connection (unplug/Wi-Fi off), then get help from someone you trust."},
{m:3,q:"A 'tech support agent' says your computer is infected and demands payment in gift cards to clean it. What does the gift-card demand prove?",
o:["Nothing — gift cards are a normal payment method for support","That it's a scam: no legitimate company takes gift cards as payment, ever","That the infection is real but the price is negotiable","That you should pay half now and half later"],a:1,
why:"The gift-card demand is the entire tell. No real business — not Microsoft, not your power company, not the IRS — accepts gift cards. Hang up."},
{m:3,q:"You get a cold call from someone claiming to be your bank's fraud department, asking you to 'verify' your full card number. Best response?",
o:["Give them the card number — they called about fraud, so it must be safe","Ask for their employee ID, then give the number","Hang up and call the number on the back of your card yourself","Give them only the last 4 digits to be safe"],a:2,
why:"Caller ID is spoofed in seconds and 'verify your card' is the oldest trick in the book. End the call and dial the bank yourself on a number you trust. If it was real, they'll confirm."},
/* ============ MODULE 4 — Wi-Fi & Safe Browsing ============ */
{m:4,q:"You're on coffee-shop Wi-Fi and your bank's site shows the padlock (https). What can another person on that same network actually see?",
o:["Everything you type, including your password","Which websites you visit — but not the contents of your encrypted sessions","Nothing at all — the padlock hides everything","Your bank balance but not your login"],a:1,
why:"HTTPS encrypts the content of your session, so passwords stay hidden. But the Wi-Fi operator (or a snooper) can still see which sites you connect to. For sensitive business, use your phone's hotspot instead."},
{m:4,q:"A shopping site has the padlock icon and an https address. What does that guarantee?",
o:["The site is legitimate and safe to buy from","That your connection to the site is encrypted — nothing more","That the products are genuine","That the site is based in your country"],a:1,
why:"The padlock only means the connection is encrypted. Scammers get free certificates too. A padlock on a fake site just means your data is encrypted on its way to the criminal."},
{m:4,q:"You need a free video converter. What's the safest way to get one?",
o:["Click the first Google ad result — ads are vetted","Download it from the program's official website or your device's official app store","Use whichever download button is biggest on a free-download site","Ask a stranger in a forum to email you their copy"],a:1,
why:"Search ads and free-download sites are prime malware territory. The official site or the official app store is the safe channel — and always check the file extension before running anything."},
{m:4,q:"A free VPN app promises 'total privacy, no logs, 100% free forever.' What's the realistic concern?",
o:["There is none — free VPNs are charity projects","Free VPNs are often funded by logging and selling your browsing data — the opposite of privacy","Free VPNs are illegal to operate","Free VPNs only work on Android"],a:1,
why:"Running servers costs money. If you're not paying, your data is the product. Use a reputable paid VPN if you need one — or skip it; a VPN doesn't protect you from scams anyway."},
{m:4,q:"Your hotel's Wi-Fi list shows 'Hotel-Guest', 'Hotel-Guest-FREE', and 'Hotel Guest 5G'. What's the safest move?",
o:["Connect to whichever has the strongest signal","Ask the front desk for the exact official network name, and turn off auto-join for open networks","Connect to all three and see which loads fastest","Open networks are all equally safe"],a:1,
why:"Attackers set up 'evil twin' networks with convincing names to intercept your traffic. Confirm the real name with staff, and stop your phone from auto-joining any open network it remembers."},
/* ============ MODULE 5 — Updates & Backups ============ */
{m:5,q:"Why do security experts say to install software updates promptly instead of postponing them for months?",
o:["Updates make your computer faster","Attackers study each patch to learn the flaw it fixes, then target people who haven't updated","Updates are required by law","Postponing updates voids your warranty"],a:1,
why:"Every patch announcement is a roadmap: it tells attackers exactly which vulnerability to exploit and who is still exposed. The longer you wait, the more the attackers know."},
{m:5,q:"Ransomware hits your computer. Your external backup drive is plugged in and always connected. What likely happened to your backups?",
o:["They're safe — ransomware only targets the main drive","The ransomware likely encrypted the backup drive too, because it could reach it","External drives are immune to ransomware","Backups are automatically restored by Windows"],a:1,
why:"Ransomware encrypts everything it can reach — including always-connected drives and cloud sync folders. Keep one backup copy disconnected (unplugged in a drawer) or truly offline."},
{m:5,q:"What is the 3-2-1 backup rule?",
o:["Back up 3 times a day, 2 times at night, 1 time on weekends","Keep 3 copies of important data, on 2 different kinds of storage, with 1 copy offsite or offline","Use 3 passwords, 2 devices, 1 cloud account","It refers to 3 antivirus scans per week"],a:1,
why:"Three copies protects against one failure, two media types protects against one technology failing, and one offsite/offline copy protects against ransomware, fire, and theft."},
{m:5,q:"The 2017 WannaCry ransomware attack devastated thousands of organizations. What made it especially frustrating?",
o:["No patch existed at the time","Microsoft had released the fix two months earlier — victims simply hadn't installed it","It only affected brand-new computers","It was spread by USB drives left in parking lots"],a:1,
why:"WannaCry exploited a flaw Microsoft had already patched. The victims were organizations that delayed updates. Patching is the cheapest, most boring, most effective defense there is."},
{m:5,q:"Ransomware has locked your files and the note demands payment in cryptocurrency. What's the correct call?",
o:["Pay immediately — it's the fastest way to get files back","Never pay: payment rarely restores everything, marks you as someone who pays, and funds the next attack","Pay half to show good faith, then negotiate","Pay only if the amount is under $500"],a:1,
why:"Paying funds criminals, rarely returns all your files, and puts you on a list of people who pay (expect a second hit). Restore from backups instead — this is what they're for."},
/* ============ MODULE 6 — Mobile Security ============ */
{m:6,q:"You get a text: 'TOLL AUTHORITY: You have an unpaid toll of $12. Pay within 24 hours to avoid a fine:' with a link. You don't remember driving a toll road. Best move?",
o:["Tap the link and pay — it's only $12","Reply STOP to unsubscribe","Don't tap the link. Open your toll agency's official app or site yourself (or ignore it if you never use tolls)","Call the number in the text to confirm"],a:2,
why:"Toll-road smishing is one of the most common text scams: the link leads to a card-harvesting page. Verify through a channel you chose — never the link in the text."},
{m:6,q:"A simple photo-editing app asks for access to your contacts, location, and microphone. What's the right response?",
o:["Allow everything — apps need permissions to work","Deny the permissions it doesn't need; a photo app has no business reading your contacts","Delete the app and buy a new phone","Allow it just this once and forget about it"],a:1,
why:"Least privilege: grant only what the app needs to function. Permission-hungry free apps are often harvesting data to sell — location and contacts are the most valuable."},
{m:6,q:"Your phone is stolen. What are the correct FIRST three moves, in order?",
o:["Buy a new phone, change your passwords, file a police report","Use Find My to locate and remotely lock it; remote-wipe it if it's unrecoverable; call your carrier to suspend the line","Text the thief and offer a reward","Wait 24 hours to see if it turns up"],a:1,
why:"Lock it remotely first (stops access), wipe it if it's gone for good (protects your data), and suspend the line (blocks SIM-swap and call/text abuse). Do this before anything else."},
{m:6,q:"A caller says they're from your bank and asks you to read back the verification code that just arrived by text. What should you do?",
o:["Read it back — they need it to verify your identity","Read back only the first 3 digits","Stop. That code is the key to YOUR account — a real bank will never ask you to read it to them","Ask them to text it to you again first"],a:2,
why:"Verification codes prove account ownership to the service. Reading one to a caller hands them the keys — this is how account takeovers happen. Hang up."},
{m:6,q:"When is the right time to set up Find My (iPhone) / Find My Device (Android) and test that it works?",
o:["After your phone is lost or stolen","Right now, while the phone is in your hand — it can't help you if it was never turned on","Only when traveling abroad","Only for expensive phones"],a:1,
why:"Find My must be enabled BEFORE the loss. Test it today: log into iCloud/Google on a computer and confirm you can see the phone's location."},
/* ============ MODULE 7 — Scams ============ */
{m:7,q:"Someone you've messaged online for three weeks says he's a soldier deployed overseas, his camera is broken, and he needs $800 in gift cards for a medical emergency. Name the TWO clearest red flags and the right move.",
o:["He's in the military and he's overseas — both are red flags; send the money anyway","He won't video call and he demands gift cards; stop, send nothing, save messages and report the profile","He types too fast and uses emojis; block him silently","There are no red flags here — this sounds legitimate"],a:1,
why:"Never being able to video call + demanding gift cards = the romance-scam script, word for word. No legitimate person or organization takes gift cards. Stop, keep the evidence, report it."},
{m:7,q:"Why do scammers demand gift cards, crypto, or wire transfers instead of checks or credit cards?",
o:["Because they're faster for the victim","Because those payments are effectively irreversible and hard to trace — once the numbers are read or the transfer clears, the money is gone","Because banks refuse to process scam payments","Because gift cards have better exchange rates"],a:1,
why:"Irreversibility is the whole point. A credit card charge can be disputed and reversed; a gift-card code read over the phone is cash handed to a stranger, gone in seconds."},
{m:7,q:"A 'recruiter' who found YOU over text hires you after a chat interview, then sends a $2,500 check for 'equipment' and asks you to forward $800 to their 'vendor' via a payment app. What happens if you do?",
o:["You get to keep the equipment and the job","The check bounces days later — it was fake — and the $800 you sent was real money you're now liable for","The vendor sends you extra equipment as a bonus","Nothing — banks insure against this"],a:1,
why:"This is the classic fake-check scam. The check is counterfeit; your forwarded money is real. You're on the hook with your bank for the full fake deposit."},
{m:7,q:"A rental listing is half the normal price, the 'landlord' is out of state and can't show it, and they want a deposit via Zelle before you can see the place. What's the safe move?",
o:["Send the deposit quickly before someone else takes it","Send half the deposit as a show of good faith","Walk away — or insist on an in-person viewing and verify the real owner through county property records first","Ask for more photos to be sure"],a:2,
why:"Price too good to be true + can't view it + pressure to pay via irreversible methods = the rental-scam script. Never pay for a place you haven't seen in person."},
{m:7,q:"An unexpected caller demands money with extreme urgency — 'pay right now or else.' What personal rule defeats this pressure tactic?",
o:["Always pay immediately to avoid trouble","A 24-hour pause plus a second opinion from someone you trust before any unexpected money moves","Negotiate the amount down","Ask them to call back tomorrow at the same time"],a:1,
why:"Urgency is manufactured so you don't think. A mandatory cooling-off period and a second pair of eyes break the spell — scammers fear your friends' common sense."},
/* ============ MODULE 8 — Hacked: Now What ============ */
{m:8,q:"You suspect your accounts are compromised. Why do you change your EMAIL password before your BANK password?",
o:["Email passwords are easier to remember","Because password resets for your bank — and nearly everything else — go through your email; whoever controls email can reset everything","Banks don't allow password changes after a hack","Email companies require it by policy"],a:1,
why:"Your email is the master key to your digital life. Lock it first, or the attacker just resets the bank password again through the email they still control."},
{m:8,q:"Why should you change those passwords from a DIFFERENT, clean device instead of the one you think is compromised?",
o:["Clean devices have faster internet","The compromised device may be logging your keystrokes — typing a new password into it hands the attacker the new password too","It's just a superstition with no real basis","Clean devices automatically generate stronger passwords"],a:1,
why:"Keyloggers and spyware record everything you type. New passwords entered on the infected machine go straight to the attacker. Use a trusted device, then clean the compromised one."},
{m:8,q:"Which of these are legitimate places to report cybercrime or fraud in the US?",
o:["ReportFraud.ftc.gov (FTC) and ic3.gov (FBI's Internet Crime Complaint Center)","Your local newspaper's tip line and a TV station","The scammer's own website contact form","There is nowhere to report — don't bother"],a:0,
why:"The FTC's ReportFraud site, the FBI's IC3, the FTC's IdentityTheft.gov, and your local police are the real reporting channels. Reports build the cases that take scammers down."},
{m:8,q:"After a suspected hack, you notice your email has inbox rules you never created — auto-deleting 'password changed' alerts. What does this mean?",
o:["Your email provider added new features","An attacker created filters to hide their activity and security warnings from you — delete the rules","It's a harmless glitch","Your spam filter is working correctly"],a:1,
why:"Hiding security alerts with inbox rules is a standard attacker move. Unknown filters = someone else has been in your account. Remove them and treat the account as compromised."},
{m:8,q:"You suspect malware on your computer. What's the correct FIRST response?",
o:["Immediately wipe the computer and reinstall everything","Disconnect it from the network (airplane mode / unplug) to stop data theft, preserve evidence like ransom notes and phishing messages, THEN clean it","Keep using it normally while you research","Post about it on social media"],a:1,
why:"Isolate first: disconnecting stops data theft in progress and malware spreading to other devices. Preserve evidence before wiping — then clean from a position of control."},
/* ============ MODULE 9 — Identity Theft ============ */
{m:9,q:"Why must you freeze your credit at ALL THREE bureaus (Equifax, Experian, TransUnion) instead of just one?",
o:["It's a legal requirement or the freeze is invalid","The bureaus are independent — a lender pulling from an unfrozen bureau can still approve a fraudulent application","Freezing one automatically freezes the others after 24 hours","You get a discount for freezing all three"],a:1,
why:"Bureaus don't share freeze status, and different lenders pull different bureaus. One unfrozen bureau is an open door — freeze all three."},
{m:9,q:"A coworker claims a credit freeze will lower your credit score and stop your current cards from working. What's true?",
o:["They're right — expect about a 20-point drop","A freeze only blocks NEW credit applications; your existing accounts and your score are completely unaffected","Freezes expire after 90 days","You can never unfreeze once it's placed"],a:1,
why:"A freeze tells bureaus not to release your report to new creditors. Your score, your cards, your mortgage — all untouched. It's free by federal law."},
{m:9,q:"Your e-file is rejected: a tax return was already filed with your Social Security number. What do you do?",
o:["Wait a few days and e-file again — probably a glitch","File a paper return with IRS Form 14039 (Identity Theft Affidavit) attached — unless the IRS already sent you a letter about the suspicious return, in which case follow that letter's instructions","Call your state attorney general and ask them to fix it","Do nothing — the IRS sorts these out automatically"],a:1,
why:"Form 14039 starts the IRS identity-theft process. But if the IRS already contacted you (e.g., Letter 5071C), follow those instructions instead of filing the form."},
{m:9,q:"A website offers to place a credit freeze for you — for a $29.99 fee. What should you conclude?",
o:["That's the standard price — pay it","Freezes are free by federal law. A site charging for one means you're on the wrong site or being scammed","The fee is only charged in some states","Pay it — the bureaus charge each other"],a:1,
why:"Federal law makes freezes (placing, temporarily lifting, removing) free at all three bureaus. Any fee = wrong site or scam. Go to the bureaus' official freeze pages."},
{m:9,q:"What is an IRS Identity Protection PIN (IP PIN) and why get one?",
o:["A 4-digit code for your bank's phone system","A six-digit number, new each year, that only you and the IRS know — once enrolled, no federal tax return can be filed under your SSN without it","A PIN that freezes your credit automatically","A password for the IRS website that never changes"],a:1,
why:"The IP PIN kills tax-refund identity theft: even with your SSN, a thief can't file a fraudulent return without that year's PIN. Anyone with an SSN can enroll — you don't have to be a victim first."},
/* ============ MODULE 10 — Privacy ============ */
{m:10,q:"How do data brokers realistically make phishing scams more convincing?",
o:["They hack your phone and read your messages","They sell profiles with your real name, address, phone, and habits — scammers use those details to make fake texts and calls feel personal","They sell your passwords directly to scammers","They don't — brokers only sell to legitimate businesses"],a:1,
why:"The 'how did they know my address?' mystery is solved: they bought it. Real personal details make fake messages feel real. Brokers trade in details; passwords come from breaches, not brokers."},
{m:10,q:"Your friend says 'I have nothing to hide, so privacy settings are pointless.' What's the strongest response?",
o:["They're right — privacy only matters for criminals","Privacy is about control: your data powers scams, stalking, and fraud against ordinary people — every fact about you is a tool someone can use","Only celebrities need privacy settings","The government already knows everything anyway"],a:1,
why:"'Nothing to hide' misses the point. Scammers don't care about your secrets — they want your name, address, routine, and relatives to run cons. Privacy settings raise the cost of targeting you."},
{m:10,q:"You grant a free weather app 'always allow' location access. What's the realistic risk?",
o:["None — weather apps can't share data","The app may sell your precise location history to data brokers, mapping your home, work, and daily routine for sale to anyone","It will only drain your battery faster","Location data is protected by law and can never be sold"],a:1,
why:"Free apps routinely monetize location through brokers. 'Always' access builds a map of your life. Set it to 'while using' or 'never' — and delete apps you don't use."},
{m:10,q:"You register your number on the National Do Not Call Registry (donotcall.gov). What will this accomplish?",
o:["It will stop all scam calls immediately","It cuts legitimate telemarketing calls — but scammers are criminals who ignore registries, so scam calls continue","It blocks all unknown callers automatically","It reports scammers to the police"],a:1,
why:"The registry binds law-abiding telemarketers, not criminals. Still worth doing — fewer total calls means the scam calls that remain stand out more."},
{m:10,q:"You use Google's 'Results about you' tool to remove a search result showing your home address. What did you actually accomplish?",
o:["The information is deleted from the original website","It stops showing up in a casual Google search — but the data still exists on the original site","It deletes your Google account","Nothing — the tool doesn't work"],a:1,
why:"The tool removes the result from Google search, which is where most snoopers stop looking. But the source site still has it — you must also opt out at the source."},
/* ============ MODULE 11 — Family Safety ============ */
{m:11,q:"Your 10-year-old finds a website offering 'FREE Robux — just log in to verify!' What's the truth?",
o:["Some of these are legitimate Roblox promotions","It's a phishing scam — the 'login' steals the account. Real game companies never give away currency through random websites","It's safe as long as nothing is downloaded","It works but Roblox takes a cut"],a:1,
why:"The login form IS the theft. 'Free currency' sites exist for one purpose: harvesting kids' accounts. Drill the rule in: free Robux sites are always fake."},
{m:11,q:"Your child's new gaming 'friend' wants to move to private DMs and says 'don't tell your parents, they'll ruin it.' What's the right move?",
o:["Let it play out — kids need privacy","Treat 'keep it secret from your parents' as an immediate red flag: talk to your child, review the messages together, block the account, and report it if anything was inappropriate","Take the device away for a month with no explanation","Message the 'friend' yourself to investigate"],a:1,
why:"Secrecy from parents is the predator playbook's core move. Stay calm, look together, block, report. Punishing the child only teaches them to hide the next one better."},
{m:11,q:"What's the most realistic protection against your child's game account being stolen?",
o:["A complicated password the child memorizes","Two-factor authentication on the account, plus the rule that no one legitimate ever needs your password — not game staff, not YouTubers","Only playing on weekends","Using the same password as their school account"],a:1,
why:"2FA stops most account theft even when the password leaks. And 'no one legitimate needs your password' is the single rule that kills every 'I'm from support' con."},
{m:11,q:"You suspect an adult is exploiting your child online. What should you do FIRST?",
o:["Confront the person directly","Stop the contact, preserve evidence (screenshots, usernames — delete nothing), and report to the National Center for Missing & Exploited Children (CyberTipline.org) and local police","Delete everything so your child isn't embarrassed","Wait to see if it happens again"],a:1,
why:"Evidence first, confrontation never. Screenshots and usernames are what law enforcement needs. Report to CyberTipline.org and police — don't tip off the suspect."},
{m:11,q:"What's the single most protective thing a parent can do about their kids' online safety?",
o:["Install the strictest possible parental controls and say nothing","Keep the conversation open so the child reports weird encounters — a kid who tells you 'someone asked me for a picture' is safer than a locked-down kid who hides everything","Ban all devices until age 18","Only allow educational apps"],a:1,
why:"Controls are one layer; determined kids bypass them. The relationship is the real protection: make it safe to report ('you'll never be in trouble for telling me'), and charge devices overnight outside bedrooms."},
/* ============ MODULE 12 — Seniors ============ */
{m:12,q:"Your grandmother gets a panicked call from someone who sounds like your cousin: he's in jail, needs bail money wired NOW, and 'don't tell Mom.' What's the right response?",
o:["Wire the money immediately — you can't risk it being real","Hang up, call your cousin directly on a number you already have, and check the family code word — 'don't tell anyone' is the scammer's shield","Ask the caller for the cousin's Social Security number to verify","Call the number the 'lawyer' gave you to confirm"],a:1,
why:"The secrecy request is the tell — it keeps you from checking. Always verify through a separate trusted channel, and never use contact info the caller provides."},
{m:12,q:"Your dad's computer shows a full-screen 'Microsoft Security Alert' with a phone number to call. What's true?",
o:["Microsoft sometimes does this for serious infections — he should call","It's a scam — Microsoft and Apple never show pop-ups with phone numbers or call users about viruses. Close the browser (or restart) and don't call","He should call but withhold payment info","The warning is real but the number is fake — Google Microsoft's real number instead"],a:1,
why:"Tech companies don't do this, period. The pop-up manufactures panic; closing it ends the attack. Never call the number on the screen."},
{m:12,q:"What's the best way to START the scam-protection conversation with an aging parent?",
o:["Tell them directly that older people are easy targets","Lead with yourself — 'I almost got scammed, let's set up protections together' — a team effort with concrete tools like a family code word","Wait until after they've been scammed so the lesson sticks","Send them articles and hope they read them"],a:1,
why:"Dignity first: nobody absorbs advice that starts with 'you're vulnerable.' A team framing plus concrete tools (code word, the hang-up rule) actually sticks — and revisit it yearly."},
{m:12,q:"Why does a family code word ALSO defeat AI voice-cloning scams?",
o:["Scammers can't pronounce code words","A cloned voice can imitate how someone sounds, but it can't know a secret it was never told — the code word moves verification from recognition (broken) to shared knowledge (unbroken)","Code words are legally required for emergency calls","The AI software crashes on unknown words"],a:1,
why:"Voice recognition as a security check died around 2023. Shared secrets didn't. 'What's the code word?' settles a cloned-voice call in five seconds."},
{m:12,q:"Your mom was scammed once last year. Why should the whole family now be MORE vigilant, not less?",
o:["Past victims land on 'sucker lists' bought and sold between scammers — expect more attempts, so tighten every protection","Lightning never strikes twice","Scammers feel guilty and leave victims alone afterward","The police now monitor all her calls"],a:0,
why:"Victim lists are a traded commodity. One successful scam marks the person as a proven payer. After any scam: bank alerts, credit freeze, call screening — everything tightened."},
/* ============ MODULE 13 — AI Scams ============ */
{m:13,q:"It's 11pm. A call comes in and it genuinely sounds like your son, crying, saying he's been arrested and needs bail wired immediately. 'Don't hang up,' the caller says. What's the right move?",
o:["Stay on the line and wire the money — it really sounds like him","Hang up immediately, call your son on his real number, and ask for the family code word","Ask the 'officer' for badge and case details to verify","Wire half now to show good faith while you check"],a:1,
why:"'Don't hang up' is the scammer's leash — it stops you from verifying. Break it. The real person is one call away on a number you trust, and the code word settles it instantly."},
{m:13,q:"Why is 'look for bad spelling' no longer useful advice for spotting phishing?",
o:["Scammers now hire professional editors","AI writes flawless, personalized phishing at scale — perfect grammar, your real job title, real logos. The old tells are dead","Email providers auto-correct scam emails","Spelling was never a useful tell"],a:1,
why:"AI killed the typo tell. Modern phishing is grammatically perfect and personalized with scraped data. The new tells: urgency + secrecy, link mismatches, and unexpected 2FA codes."},
{m:13,q:"A phishing email has perfect grammar, your company's real logo, and references your actual job title and a real vendor. What should you conclude?",
o:["It must be legitimate — scammers can't get those details right","AI can personalize phishing at scale from public data — verify through a separate channel (type the address yourself, call the company) instead of clicking","Your company's IT department has been hacked","Perfect grammar means it passed the spam filter, so it's safe"],a:1,
why:"Personalization is cheap now; LinkedIn and breach data feed it. Legitimacy is proven through independent verification, never through how convincing the email looks."},
{m:13,q:"You receive a two-factor login code you did NOT request. What does this mean and what should you do?",
o:["It's a glitch — enter it on the site to clear it","Someone has your password and is trying to log in right now. Don't enter the code anywhere — go change your password instead","Your authenticator app is broken","Forward the code to your email for safekeeping"],a:1,
why:"An unrequested code means an attacker is at your login screen with your password, waiting on the second factor. Don't hand it to them — lock them out with a new password."},
{m:13,q:"A video of a famous billionaire 'endorsing' a crypto investment platform is all over social media. What's the correct read?",
o:["Celebrity endorsements are regulated, so it must be real","It's almost certainly an AI deepfake — no legitimate investment opportunity arrives via a social media video, no matter whose face is on it","It's real if the video is longer than 60 seconds","Only believe it if friends shared it"],a:1,
why:"Deepfake endorsements are a documented scam factory. Real investments don't recruit through viral videos. Face, voice, and production value prove nothing anymore."},
/* ============ MODULE 14 — Small Business ============ */
{m:14,q:"What's the single highest-impact security step a small business can take?",
o:["Buying expensive antivirus software","Turning on multi-factor authentication for business email and financial accounts — email compromise lets attackers reset other accounts, impersonate you to customers, and intercept payments","Hiring an IT consultant for a one-time audit","Upgrading to a faster internet plan"],a:1,
why:"Your business email can reset your bank, invoice your customers as 'you,' and reroute payments. MFA on email blocks the most common and most damaging attack path — and it's free."},
{m:14,q:"Your bookkeeper gets an email that looks like your regular supplier: 'We've updated our banking details — use the new account for this month's payment.' What's the right move?",
o:["Update the details and pay — it looks legitimate","Call the supplier at a phone number you already have (not one in the email) and confirm before sending anything","Reply to the email asking if it's real","Pay half now, half after they confirm"],a:1,
why:"Changed bank details are the #1 business-email-compromise pattern. Verify through a channel the attacker doesn't control. Replying to the email just talks to the scammer."},
{m:14,q:"An employee leaves on Friday. What's the security-critical offboarding step?",
o:["Nothing urgent — handle it next week","Disable their accounts and change shared passwords THAT DAY — email, social media, point-of-sale, everything","Just ask them to delete passwords from their phone","Change the Wi-Fi password only"],a:1,
why:"Same-day deprovisioning. Lingering access is how ex-employees — or anyone who compromises their old device — walk right back in months later."},
{m:14,q:"Your business email is sending invoices to customers, but you didn't send them — and you find an inbox rule silently forwarding your mail to an unknown address. What happened?",
o:["Your email provider is testing features","Business email compromise: an attacker is inside your email, hiding their activity with forwarding rules while impersonating you to steal customer payments","A software bug duplicated your invoices","Your customers are forwarding your mail themselves"],a:1,
why:"This is textbook BEC: hijack the inbox, hide with rules, learn your invoicing patterns, then email customers 'updated bank details' from your address. Lock the account down immediately."},
{m:14,q:"A 'vendor' calls your newest employee with an urgent, confidential request to wire money today, saying the boss approved it. What policy stops this?",
o:["Caller ID verification","A two-person rule: any wire, ACH change, or new vendor payment gets confirmed by a second person — or by calling the vendor at a known number. No exceptions","Banning all phone calls at work","Only the boss is allowed to send wires"],a:1,
why:"Urgency + secrecy + a new employee = the BEC formula. A mandatory second pair of eyes (or a callback on a known number) breaks it every time."},
/* ============ MODULE 15 — Glossary ============ */
{m:15,q:"What's the difference between smishing and vishing?",
o:["Smishing is phishing by SMS text; vishing is phishing by voice phone call","Smishing targets phones; vishing targets computers","They're two names for the same thing","Smishing is legal marketing; vishing is illegal"],a:0,
why:"The channel is the difference: smishing = SMS, vishing = voice. Same goal (trick you into acting), different medium — and both are everywhere."},
{m:15,q:"What makes 'spear phishing' more dangerous than ordinary phishing?",
o:["It uses a spear-shaped USB device","It's aimed at YOU specifically, using your real name, job, or details to seem legitimate","It only targets fish markets","It's sent exclusively on weekends"],a:1,
why:"Generic phishing blasts thousands hoping someone bites; spear phishing researches one target. Personal details make it far more convincing — verify independently, as always."},
{m:15,q:"What is ransomware?",
o:["Software that speeds up your computer for a fee","Malware that locks (encrypts) your files and demands payment for the key — and paying doesn't guarantee you get them back","A type of firewall","A backup program"],a:1,
why:"Ransomware holds your files hostage. The defense is backups you can restore from — because paying criminals is a gamble that funds the next attack."},
{m:15,q:"In criminal slang, what is a 'fullz'?",
o:["A fully updated antivirus program","A complete stolen identity profile — name, SSN, date of birth, address — sold on illicit markets for a few dollars","A type of firewall rule","A backup that finished successfully"],a:1,
why:"A 'fullz' is everything needed to impersonate you: name, SSN, DOB, address. It sells for pocket change — which is why a credit freeze (making the SSN useless) matters more than secrecy."},
/* ============ MODULE 16 — Smart Home ============ */
{m:16,q:"You put all your smart cameras and plugs on a separate guest Wi-Fi network from your laptop and phone. Why does this help?",
o:["It makes your Wi-Fi faster","If a smart device gets hacked, the attacker can't easily reach your computers — the damage is contained","Guest networks are invisible to attackers","It lets you use a weaker password on the guest network"],a:1,
why:"Network segmentation limits the blast radius: a hacked camera on the guest network is isolated from the devices holding your banking, email, and files."},
{m:16,q:"Which of these is the most dangerous thing to leave unchanged on a smart device?",
o:["Your smart TV's screensaver","Your camera's factory default password (like admin/12345)","Your smart speaker's wake word","Your router's Wi-Fi network name"],a:1,
why:"Factory passwords are printed in manuals and tried automatically worldwide — the 2016 Mirai botnet seized hundreds of thousands of devices exactly this way. Change every default password."},
{m:16,q:"What's the smartest use of the mic-off button on a smart speaker?",
o:["Press it only during phone calls","Leave the mic off permanently","Press it during sensitive conversations and whenever the speaker isn't actively being used","The button is decorative and does nothing"],a:2,
why:"The mic-off button physically cuts the microphone. Use it during private conversations and when you don't need voice control — convenience shouldn't mean a live mic 24/7."},
{m:16,q:"Your smart speaker sits near a living-room window and is linked to your smart door lock. What's the risk?",
o:["There is none — speakers recognize their owner's voice perfectly","Someone outside can speak (or play a recording) through the window and command the speaker to unlock the door","The speaker will unlock the door during thunderstorms","Window glass blocks all sound"],a:1,
why:"Smart speakers generally can't distinguish you from a recording played nearby. Voice-match helps, but never link voice control to door locks — or disable purchasing and sensitive actions."},
/* ============ MODULE 17 — Social Media ============ */
{m:17,q:"Your aunt gets a Facebook message from a profile with YOUR name and photo, asking her to buy gift cards for an 'emergency.' What's the right move?",
o:["Buy the cards — it might really be you","Call you at your real phone number to verify before doing anything","Reply asking for more details about the emergency","Send a smaller amount to be safe"],a:1,
why:"Cloned profiles are one of the most common social media scams. Never send money or codes based on a message alone — verify through a channel you already trust."},
{m:17,q:"Which two-factor method best protects your Instagram account against a SIM-swap attack?",
o:["Texted (SMS) codes","An authenticator app on your phone","Email codes","Answering a security question"],a:1,
why:"A SIM swap intercepts your texts — including SMS 2FA codes. An authenticator app generates codes on your device, out of the carrier's reach."},
{m:17,q:"You're flying out for a two-week vacation. What's the safest posting plan?",
o:["Post the boarding pass and daily countdowns","Post live updates to a private story only","Enjoy the trip and post the photos AFTER you're home","Post your hotel name so friends know where to reach you"],a:2,
why:"Real-time vacation posts advertise an empty house — and boarding passes leak your full name and booking code. Post after you're home."},
{m:17,q:"Your password-reset security questions are 'What street did you grow up on?' and 'What was your first pet's name?' Why is this risky?",
o:["Security questions are unhackable","The answers are probably findable on your public social media posts — hometown, high school, pet names","Nobody ever guesses security questions","The questions are too hard to remember"],a:1,
why:"Your profile is a public diary: hometown, pet names, birthdays. Attackers harvest these to beat 'forgot password.' Treat security-question answers like passwords — or better, don't use ones with public answers."},
/* ============ MODULE 18 — Seasonal Scams ============ */
{m:18,q:"You get a call from 'the IRS': you owe back taxes and must pay immediately with gift cards or face arrest. What should you do?",
o:["Buy the gift cards — you don't want to be arrested","Ask for their badge number to verify","Hang up — the IRS's first contact is always by mail, and it never demands gift cards or threatens arrest by phone","Pay a smaller amount to make them go away"],a:2,
why:"The IRS doesn't operate this way, ever: first contact by mail, no gift cards, no arrest threats by phone. Badge numbers and callback numbers are easily faked. Hang up."},
{m:18,q:"After a major hurricane, you want to donate to a relief charity you saw on social media. What's the safest first step?",
o:["Donate immediately — speed matters","Look it up on the IRS Tax Exempt Organization Search and donate through the charity's own website","Send money to the payment-app link in the post","Donate only if the post has lots of shares"],a:1,
why:"Disaster scams spin up fake charities within hours. Verify it's a real tax-exempt org and donate on its own site — never through a post's link or a personal payment app. Shares prove nothing."},
{m:18,q:"A text says your package couldn't be delivered: click a link and pay a $2.99 redelivery fee with your card. Why is this a scam?",
o:["Delivery companies never send texts at all","Real carriers don't collect fees or card details through random texted links — track the package on the carrier's official site instead","$2.99 is too cheap to be real","Small fees like this are always legitimate"],a:1,
why:"The tiny fee is bait for your card number. Real carriers don't operate this way. Got a tracking number? Type the carrier's address yourself and check it there."},
{m:18,q:"A holiday deal on an unknown website offers a $400 game console for $79, with a countdown timer screaming 'only 2 left!' What's the right read?",
o:["Buy two before they sell out","Too good to be true + manufactured urgency = classic fake-store pattern. Verify the seller independently before paying a cent","Countdown timers are proof of legitimacy","Unknown sites always have the best prices"],a:1,
why:"Impossible prices plus urgency is the fake storefront formula: you pay, nothing ships (or a counterfeit arrives). Check reviews, contact info, and the domain's age — or buy from a retailer you know."},
/* ============ MODULE 19 — Health Scams ============ */
{m:19,q:"A friendly caller says they're from Medicare, offering a free genetic cancer screening 'fully covered' — they just need your Medicare number to confirm eligibility. What should you do?",
o:["Give them the number — it's free and Medicare is calling","Decline and hang up — Medicare never cold-calls offering free services for your number; this is a known billing-fraud scheme","Give the number but ask them to call back tomorrow","Accept the test but refuse to give the number"],a:1,
why:"Medicare doesn't cold-call with free offers. This is documented fraud: scammers bill Medicare for tests you never needed, using your number. Real testing goes through YOUR doctor."},
{m:19,q:"An online pharmacy sells your prescription for 80% less than your local pharmacy — no prescription required. What's the right call?",
o:["Order it — the savings are worth it","Order a small amount first to test","Don't order — legitimate pharmacies always require a prescription; no-prescription sites are a hallmark of counterfeit operations","Order it but pay with a prepaid card to be safe"],a:2,
why:"'No prescription required' is the defining red flag of an illegal pharmacy. Counterfeits can contain wrong doses, no active ingredient, or poison. Your health isn't a bargain hunt."},
{m:19,q:"You receive a breach letter: a billing company exposed your name, Social Security number, and treatment dates. What's the most protective single step?",
o:["Throw the letter away — breaches happen all the time","Change your email password","Freeze your credit with all three bureaus and monitor your Explanation of Benefits statements","Call the billing company and demand they delete your data"],a:2,
why:"An exposed SSN is an identity-theft starter kit: freeze all three bureaus (free, blocks new accounts) and watch your EOB statements for medical care you never received."},
{m:19,q:"Medical bills arrive for care you never received — a surgery in a state you've never visited. What's happening and what do you do?",

<script>
"use strict";
/* ================= HACKPROOF EXAM APP ================= */
(function(){
const $ = (s)=>document.querySelector(s);
const app = $("#app");
function esc(s){return String(s).replace(/[&<>"']/g,(c)=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function shuffled(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=a[i]; a[i]=a[j]; a[j]=t; }
  return a;
}
const state = { name:"", lic:null, order:[], optMap:[], answers:new Array(90).fill(-1), cur:0, inProgress:false };

/* ============ CERTIFICATE DELIVERY SERVICE ============
   On a pass, the student's certificate code can be submitted to the
   payments/certificate service (contract: payments/README.md), which
   validates it exactly like tools/keygen.py sign-cert, countersigns
   it, and emails the OFFICIAL certificate. WIRING: set the service
   base URL here — single place, same pattern and same service as
   buy.html's PAYMENTS_API_BASE. Empty = automatic delivery not wired;
   the manual route on the certificate screen applies. */
const PAYMENTS_API_BASE = ""; // e.g. "https://<service-host>" -> POST {base}/api/certificates

/* ================= EXAM INTEGRITY MONITORING =================
   Local-only behavioral signals, computed in this browser while an
   attempt is in progress: tab switches, window blurs, copy/cut/paste
   attempts, first-answer latency per question, total duration. At
   grading time they are summarized into a verdict — "clean" or
   "flagged" — which is embedded in the certificate payload the
   student chooses to submit for countersigning, so Sentinel
   Safeguard sees it in tools/keygen.py sign-cert and decides.
   Nothing is uploaded automatically; nothing leaves this device
   except inside that certificate code. These are integrity SIGNALS,
   not proof: honest students can trip them (a notification, an
   accidental Ctrl+C) — which is why a human reviews flagged codes
   instead of the exam auto-rejecting anyone. */
const integrity = { tab:0, blur:0, copy:0, cut:0, paste:0, startedAt:0, shownAt:0, times:{} };
function integrityReset(){
  integrity.tab = 0; integrity.blur = 0; integrity.copy = 0;
  integrity.cut = 0; integrity.paste = 0;
  integrity.startedAt = performance.now(); integrity.shownAt = 0; integrity.times = {};
}
document.addEventListener("visibilitychange", function(){
  if(state.inProgress && document.hidden) integrity.tab++;
});
window.addEventListener("blur", function(){ if(state.inProgress) integrity.blur++; });
["copy","cut","paste"].forEach(function(type){
  document.addEventListener(type, function(){ if(state.inProgress) integrity[type]++; }, true);
});
function integritySummary(){
  const vals = Object.keys(integrity.times).map(function(k){ return integrity.times[k]; });
  const answered = vals.length;
  const sorted = vals.slice().sort(function(a,b){ return a-b; });
  const median = answered ? sorted[Math.floor(answered/2)] : 0;
  const fast = vals.filter(function(t){ return t < 2000; }).length;
  const secs = integrity.startedAt ? Math.round((performance.now()-integrity.startedAt)/1000) : 0;
  const flags = [];
  if(integrity.tab >= 3) flags.push("tab-switches");
  if(integrity.copy >= 2) flags.push("copy-attempts");
  if(integrity.cut >= 1) flags.push("cut-attempts");
  if(answered >= 45 && fast >= 20 && median < 2000) flags.push("uniform-fast-answering");
  if(answered >= 80 && secs > 0 && secs < 300) flags.push("total-duration");
  return {
    verdict: flags.length ? "flagged" : "clean",
    tab_switches: integrity.tab, window_blurs: integrity.blur,
    copy_attempts: integrity.copy, cut_attempts: integrity.cut,
    paste_attempts: integrity.paste,
    fast_answers: fast, median_answer_ms: median, duration_s: secs,
    flags: flags.join(",")
  };
}

/* Warn before a mid-exam reload/navigation wipes the attempt (answers
   live only in memory). Armed only between Begin and Submit. */
window.addEventListener("beforeunload", function(e){
  if(!state.inProgress) return;
  e.preventDefault();
  e.returnValue = "";
});

function gateScreen(msg){
  const savedLic = localStorage.getItem(CONFIG.LICENSE_STORAGE_KEY) || "";
  const savedName = localStorage.getItem(CONFIG.EXAM_NAME_KEY) || "";
  app.innerHTML =
  '<div class="card no-print" id="screen-gate">'+
    '<h2>The Final <span class="accent">Exam</span></h2>'+
    '<p class="lead">90 questions spanning the full HackProof course. Score <b>80% or higher</b> and your '+
    '<b>Sentinel Safeguard Certificate of Cyber Security Awareness Course Completion</b> generates instantly.</p>'+
    '<p class="hint">Integrity monitoring: while you take the exam, this page records signals locally in your browser — '+
    'tab switches, copy/paste attempts, and answer timing. Nothing is uploaded. A summary verdict (clean or flagged) '+
    'is included in your certificate code and shown to Sentinel Safeguard when you submit it for countersigning.</p>'+
    '<div class="err'+(msg?" show":"")+'" id="gate-err">'+esc(msg||"")+'</div>'+
    '<label class="field" for="gate-name">Your full name — exactly as it should appear on your certificate</label>'+
    '<input type="text" id="gate-name" placeholder="e.g. Alex Rivera" value="'+esc(savedName)+'" autocomplete="name">'+
    '<label class="field" for="gate-lic">Premium license key</label>'+
    '<textarea id="gate-lic" placeholder="Paste your premium license key here">'+esc(savedLic)+'</textarea>'+
    '<p class="hint">The exam tests the full premium course, so it requires a premium license. '+
    '<a href="game/buy.html">Get premium — $5 in BTC</a></p>'+
    '<button class="btn primary" id="gate-go">Begin the exam</button>'+
  '</div>';
  $("#gate-go").onclick = function(){
    const name = $("#gate-name").value.trim();
    const licStr = $("#gate-lic").value.trim();
    const err = $("#gate-err");
    if(name.length < 2){ err.textContent = "Enter your name — it goes on your certificate."; err.classList.add("show"); return; }
    err.classList.remove("show");
    const btn = $("#gate-go"); btn.disabled = true; btn.textContent = "Verifying license…";
    License.verifyLicense(licStr, CONFIG.LICENSE_PUBLIC_KEY_HEX).then(function(lic){
      state.name = name; state.lic = lic;
      try{ localStorage.setItem(CONFIG.EXAM_NAME_KEY, name); localStorage.setItem(CONFIG.LICENSE_STORAGE_KEY, licStr); }catch(e){}
      startExam();
    }).catch(function(e){
      err.textContent = (e && e.message) || "License check failed.";
      err.classList.add("show");
      btn.disabled = false; btn.textContent = "Begin the exam";
    });
  };
}

function startExam(){
  state.order = shuffled(QUESTIONS.map(function(_,i){return i;}));
  state.optMap = state.order.map(function(qi){
    const q = QUESTIONS[qi];
    const idx = shuffled(q.o.map(function(_,i){return i;}));
    return { order: idx, answer: idx.indexOf(q.a) };
  });
  state.answers = new Array(90).fill(-1);
  state.cur = 0;
  state.inProgress = true;
  integrityReset();
  renderQ();
}

function renderQ(){
  const qi = state.order[state.cur];
  const q = QUESTIONS[qi];
  const om = state.optMap[state.cur];
  const letters = ["A","B","C","D"];
  const answered = state.answers.filter(function(a){return a>=0;}).length;
  let nav = "";
  for(let i=0;i<90;i++){
    nav += '<button class="'+(state.answers[i]>=0?"done":"")+(i===state.cur?" cur":"")+'" data-i="'+i+'">'+(i+1)+'</button>';
  }
  let opts = "";
  om.order.forEach(function(oi,pos){
    opts += '<button class="opt'+(state.answers[state.cur]===pos?" picked":"")+'" data-pos="'+pos+'">'+
      '<span class="k">'+letters[pos]+'</span>'+esc(q.o[oi])+'</button>';
  });
  integrity.shownAt = performance.now();
  app.innerHTML =
  '<div class="card no-print protected-content" id="screen-exam">'+
    '<div class="qmeta"><span>QUESTION '+(state.cur+1)+' / 90</span><span>'+answered+' answered</span></div>'+
    '<div class="progress"><div style="width:'+Math.round(answered/90*100)+'%"></div></div>'+
    '<div class="qtext">'+esc(q.q)+'</div>'+ opts +
    '<div class="examnav">'+
      '<button class="btn ghost" id="q-prev"'+(state.cur===0?" disabled":"")+'>← Back</button>'+
      '<button class="btn ghost" id="q-next"'+(state.cur===89?" disabled":"")+'>Next →</button>'+
    '</div>'+
    '<button class="btn primary" id="q-submit">Submit exam</button>'+
    '<div class="grid90 no-print" id="qnav">'+nav+'</div>'+
  '</div>';
  const optBtns = app.querySelectorAll(".opt");
  optBtns.forEach(function(b){ b.onclick=function(){
    /* First-answer latency for this position (integrity signal). */
    if(integrity.times[state.cur] === undefined && integrity.shownAt)
      integrity.times[state.cur] = Math.round(performance.now()-integrity.shownAt);
    state.answers[state.cur]=+b.dataset.pos; renderQ();
  }; });
  $("#q-prev").onclick=function(){ if(state.cur>0){state.cur--; renderQ();} window.scrollTo(0,0); };
  $("#q-next").onclick=function(){ if(state.cur<89){state.cur++; renderQ();} window.scrollTo(0,0); };
  const navBtns = $("#qnav").querySelectorAll("button");
  navBtns.forEach(function(b){ b.onclick=function(){ state.cur=+b.dataset.i; renderQ(); window.scrollTo(0,0); }; });
  $("#q-submit").onclick=function(){
    const un = state.answers.filter(function(a){return a<0;}).length;
    if(un>0 && !confirm(un+" question"+(un>1?"s":"")+" unanswered. Submit anyway?")) return;
    grade();
  };
}

function grade(){
  state.inProgress = false; /* submitted — disarm the beforeunload guard */
  let correct = 0;
  const wrong = [];
  for(let i=0;i<90;i++){
    const qi = state.order[i];
    const q = QUESTIONS[qi];
    const om = state.optMap[i];
    if(state.answers[i]===om.answer) correct++;
    else wrong.push({i:i, qi:qi, picked:state.answers[i], om:om});
  }
  const pct = Math.round(correct/90*100);
  renderResult(correct, pct, correct>=72, wrong);
}

function renderResult(correct, pct, pass, wrong){
  const letters=["A","B","C","D"];
  let html =
  '<div class="card no-print protected-content" id="screen-result">'+
    '<h2>Your <span class="accent">Score</span></h2>'+
    '<div class="score-big '+(pass?"pass":"fail")+'">'+pct+'%</div>'+
    '<div class="verdict '+(pass?"pass":"fail")+'">'+(pass?"PASSED":"NOT PASSED")+'</div>'+
    '<p class="lead">'+correct+' of 90 correct — '+(pass?"you earned it.":"80% (72) is required to pass. Review the course and try again.")+'</p>'+
    (pass?"":'<button class="btn primary" id="retry">Retake the exam</button>')+
    '<h2 style="margin-top:18px">Review <span class="accent">('+wrong.length+')</span></h2>';
  wrong.forEach(function(w){
    const q = QUESTIONS[w.qi];
    const yourText = w.picked>=0 ? q.o[w.om.order[w.picked]] : "(no answer)";
    const rightText = q.o[w.om.order[w.om.answer]];
    html += '<div class="review-item"><div class="rq">'+esc(q.q)+'</div>'+
      '<div class="ra yours">✗ You: '+esc(yourText)+'</div>'+
      '<div class="ra right">✓ Correct: '+esc(rightText)+'</div>'+
      '<div class="why">'+esc(q.why)+'</div></div>';
  });
  html += '</div>';
  app.innerHTML = html;
  window.scrollTo(0,0);
  if(!pass){ $("#retry").onclick=function(){ gateScreen(""); }; return; }
  renderCert(correct, pct);
}

function b64e(bytes){ let s=""; for(let i=0;i<bytes.length;i++) s+=String.fromCharCode(bytes[i]); return btoa(s); }
function certId(){
  const c = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  const r = crypto.getRandomValues(new Uint8Array(6));
  let s = "";
  for(let i=0;i<6;i++) s += c[r[i] % c.length];
  return "HP-" + s.slice(0,3) + "-" + s.slice(3);
}

/* HMAC-SHA256 proof binding this certificate claim to the student's premium
   license secret S (from their verified license). Only the holder of a
   genuine Skyler-minted license can produce it — a hand-crafted payload
   with pct:100 cannot. tools/keygen.py sign-cert recomputes it before
   countersigning. The HMAC covers the canonical payload WITHOUT the proof
   field (same bytes sign-cert re-canonicalizes server-side). */
async function certProof(payload){
  if(!window.crypto || !crypto.subtle || !state.lic || !state.lic.S)
    throw new Error("crypto.subtle unavailable");
  const key = await crypto.subtle.importKey("raw", state.lic.S,
    {name:"HMAC", hash:"SHA-256"}, false, ["sign"]);
  const mac = await crypto.subtle.sign("HMAC", key,
    new TextEncoder().encode(JSON.stringify(payload)));
  return b64e(new Uint8Array(mac));
}

/* Submit the certificate code to the service (contract:
   payments/README.md). The body carries the base64 code exactly as
   produced above, the student's license_key (REQUIRED — the payload's
   HMAC proof is keyed by the license secret, so it cannot be verified
   without the key that earned it, exactly like sign-cert --license),
   the delivery email, and the integrity block. States:
   201/200 issued -> confirmation + the returned countersigned code is
   applied to the seal box automatically; 202 held_for_review -> calm
   review message (NEVER accusatory — the verdict is surfaced to
   Sentinel host-side, the student just hears "quick review");
   400 / unreachable -> the manual route below stays the path. */
async function submitCertDelivery(payload, code){
  const status = $("#cert-send-status");
  const email = ($("#cert-email").value || "").trim();
  const manual = "Use the manual route below instead: email the certificate code to " +
    "Sentinelsafeguard@outlook.com and your countersigned certificate will be emailed back to you.";
  if(!email || email.indexOf("@") < 1 || email.indexOf(".") < 0){
    status.textContent = "Enter the email address your official certificate should be sent to."; return;
  }
  if(!PAYMENTS_API_BASE){
    status.textContent = "Automatic email delivery isn't reachable from this page right now. " + manual; return;
  }
  let licenseKey = "";
  try{ licenseKey = localStorage.getItem(CONFIG.LICENSE_STORAGE_KEY) || ""; }catch(e){}
  status.textContent = "Sending…";
  try{
    const ctrl = new AbortController();
    const t = setTimeout(function(){ ctrl.abort(); }, 15000);
    const r = await fetch(PAYMENTS_API_BASE.replace(/\/+$/, "") + "/api/certificates", {
      method: "POST", headers: { "Content-Type": "application/json" }, signal: ctrl.signal,
      body: JSON.stringify({ certificate_code: code, license_key: licenseKey,
                             email: email, integrity: payload.integrity })
    });
    clearTimeout(t);
    let j = null; try{ j = await r.json(); }catch(e){}
    if(r.status === 202 || (j && j.status === "held_for_review")){
      status.textContent = "Thank you — your result is with a member of the Sentinel Safeguard team for a " +
        "quick review, a standard step for some certificates. Your official certificate will follow by " +
        "email once the review is complete. Questions? Email Sentinelsafeguard@outlook.com.";
    }else if((r.status === 201 || r.status === 200) && j && j.status === "issued"){
      status.textContent = "✓ Your certificate has been generated and emailed to " + email + ". " +
        "The certificate on this page is your instant copy — the emailed, countersigned certificate is the official one.";
      if(j.countersigned_code){
        const box = $("#cert-signed");
        if(box){ box.value = j.countersigned_code; const b = $("#cert-verify-btn"); if(b) b.click(); }
      }
    }else{
      status.textContent = "The certificate service couldn't complete this submission. " + manual;
    }
  }catch(e){
    status.textContent = "We couldn't reach the certificate service just now. " + manual;
  }
}

async function renderCert(correct, pct){
  const cid = certId();
  const date = new Date().toISOString().slice(0,10);
  const isum = integritySummary();
  const payload = { v:1, cert_id:cid, name:state.name, score:correct, pct:pct, date:date, lic_id:state.lic.id, integrity:isum };
  /* Proof FIRST (over the payload without it), then embed — sign-cert
     strips `proof` and re-canonicalizes the rest to re-verify. */
  let code = null, proofErr = "";
  try{
    payload.proof = await certProof(payload);
    code = b64e(new TextEncoder().encode(JSON.stringify(payload)));
  }catch(e){
    proofErr = "Your browser blocked the cryptographic proof this certificate needs " +
      "(WebCrypto unavailable). Open this page over HTTPS in a current browser and retake the exam — " +
      "without the proof, the certificate cannot be countersigned.";
  }
  const card = document.createElement("div");
  card.className = "card"; card.id = "screen-cert";
  card.innerHTML =
    '<h2 class="no-print">Your <span class="accent">Certificate</span></h2>'+
    '<p class="lead no-print">Congratulations, '+esc(state.name)+'. This is yours — print it, frame it, share it.</p>'+
    '<div class="cert-shell"><div class="cert">'+
      '<div class="org">SENTINEL SAFEGUARD LLC</div>'+
      '<h3>Certificate of Completion</h3>'+
      '<p class="sub">Cyber Security Awareness Course</p>'+
      '<div class="label">This certifies that</div>'+
      '<div class="name">'+esc(state.name)+'</div>'+
      '<hr class="rule">'+
      '<div class="details">has successfully completed the <b>HackProof Cyber Security Awareness Course</b><br>'+
      'Final exam score: <b>'+pct+'%</b> ('+correct+'/90) · '+esc(date)+'</div>'+
      '<div class="label">Certificate ID</div>'+
      '<div class="cid">'+esc(cid)+'</div>'+
      '<div class="sealrow"><div class="sig"><div class="line">JesusTheHacker · Sentinel Safeguard LLC</div></div>'+
      '<div class="badge" id="cert-badge">⧗ PENDING VERIFICATION</div></div>'+
    '</div></div>'+
    '<div class="no-print">'+
      '<button class="btn primary" id="cert-print">🖨 Print / Save PDF</button>'+
      '<h2 style="margin-top:18px">Get your <span class="accent">verified seal</span></h2>'+
      (code ?
        '<h2 style="margin-top:18px">Your <span class="accent">official certificate</span>, by email</h2>'+
        '<p class="lead">The certificate above is your <b>instant copy</b> — print it, frame it, share it. The <b>official</b> '+
        'record is the countersigned certificate we email you. Confirm the name and email, and we\'ll send it:</p>'+
        '<label class="field" for="cert-name-confirm">Name on the certificate</label>'+
        '<input type="text" id="cert-name-confirm" value="'+esc(state.name)+'" autocomplete="name">'+
        '<label class="field" for="cert-email">Email for your official certificate</label>'+
        '<input type="email" id="cert-email" placeholder="you@example.com" autocomplete="email">'+
        '<button class="btn primary" id="cert-send-btn">Email my official certificate</button>'+
        '<p class="hint" id="cert-send-status" role="status"></p>'+
        '<h2 style="margin-top:18px">Verified seal — <span class="accent">manual route</span></h2>'+
        '<p class="lead">If automatic delivery above isn\'t available, email the code below <b>plus your premium license key</b> to <b>Sentinelsafeguard@outlook.com</b> — '+
        'you will get back a countersigned code. Paste it here and your certificate earns its verified seal, checkable by anyone at the verify page.</p>'+
        '<div class="codebox"><textarea id="cert-unsigned" readonly>'+esc(code)+'</textarea></div>'+
        '<button class="btn ghost small" id="copy-unsigned">Copy code</button> '+
        '<button class="btn ghost small" id="copy-lickey">Copy my license key</button>'+
        '<label class="field" for="cert-signed">Countersigned code</label>'+
        '<textarea id="cert-signed" placeholder="Paste the countersigned code here"></textarea>'+
        '<div class="err" id="cert-err"></div>'+
        '<button class="btn primary" id="cert-verify-btn">Apply verified seal</button>'
        :
        '<div class="err show">'+esc(proofErr)+'</div>'
      )+
      '<p class="hint">Exam integrity monitoring (recorded locally in your browser): verdict <b>'+esc(isum.verdict)+'</b> — '+
      'tab switches: '+isum.tab_switches+', copy attempts: '+isum.copy_attempts+', median answer time: '+
      Math.round(isum.median_answer_ms/100)/10+'s. This summary travels inside your certificate code and is shown '+
      'to Sentinel Safeguard when you submit it for countersigning.</p>'+
      '<p class="hint"><a href="verify.html">Open the certificate verifier →</a></p>'+
    '</div>';
  app.appendChild(card);
  $("#cert-print").onclick=function(){ window.print(); };
  if(!code) return;
  $("#cert-send-btn").onclick=function(){ submitCertDelivery(payload, code); };
  $("#copy-unsigned").onclick=function(){ const t=$("#cert-unsigned"); t.select(); try{document.execCommand("copy");}catch(e){} };
  $("#copy-lickey").onclick=function(){
    try{
      const k = localStorage.getItem(CONFIG.LICENSE_STORAGE_KEY) || "";
      if(!k) return;
      if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(k); }
      else{
        const ta=document.createElement("textarea"); ta.value=k; document.body.appendChild(ta);
        ta.select(); try{document.execCommand("copy");}catch(e){} ta.remove();
      }
    }catch(e){}
  };
  $("#cert-verify-btn").onclick=function(){
    const err=$("#cert-err"); err.classList.remove("show");
    verifySignedCert($("#cert-signed").value.trim(), cid).then(function(ok){
      if(!ok) throw new Error("bad");
      const b=$("#cert-badge"); b.textContent="✓ VERIFIED"; b.style.background="#059669";
    }).catch(function(){
      err.textContent="That code did not verify — check for typos or request a fresh one.";
      err.classList.add("show");
    });
  };
}

function verifySignedCert(str, expectedCid){
  return new Promise(function(resolve,reject){
    try{
      const clean=(str||"").trim().replace(/\s+/g,"");
      if(!clean) throw new Error("empty");
      const raw=JSON.parse(new TextDecoder().decode(License.b64ToBytes(clean)));
      if(!raw.payload||!raw.sig) throw new Error("not signed");
      const msg=new TextEncoder().encode(JSON.stringify(raw.payload));
      const sig=License.b64ToBytes(raw.sig);
      const pk=License.hexToBytes(CONFIG.LICENSE_PUBLIC_KEY_HEX);
      const ok=nacl.sign.detached.verify(msg,sig,pk);
      /* The seal belongs on THIS certificate only: the countersigned
         payload must name the cert rendered above and the license that
         earned it — otherwise any valid countersigned code (e.g. a
         friend's) would light up the badge on an unearned cert. */
      const bound = raw.payload.cert_id===expectedCid &&
        (!state.lic || raw.payload.lic_id===state.lic.id);
      resolve(ok && bound);
    }catch(e){ reject(e); }
  });
}

/* The exam is a fixed 90-question protocol: the grading loops, the
   72/90 pass mark, and tools/keygen.py sign-cert's score validation
   (72-90 of 90, pct over 90) all assume exactly 90. If the bank is
   ever edited to a different length, fail closed with an explanation
   instead of crashing mid-exam or issuing an unsignable certificate. */
if(QUESTIONS.length !== 90){
  app.innerHTML = '<div class="card"><h2>Exam <span class="accent">unavailable</span></h2>'+
    '<p class="lead">This build\'s question bank is misconfigured. Please contact Sentinel Safeguard.</p></div>';
} else {
  gateScreen("");
}
})();
</script>
<script>
"use strict";
/* ================================================================
   HackProof content protection — shared snippet (deterrent layer).
   Scoped to .protected-content containers only: text selection is
   off via CSS; copy/cut/context-menu/dragstart are intercepted with
   a brief polite notice. Paste is NEVER intercepted (students paste
   license keys and certificate codes into form fields), form fields
   are never blocked, and screen readers are unaffected. This is a
   deterrent, not a vault: it cannot stop view-source or screenshots,
   and the product never claims otherwise.

(function(){
  function inProtected(t){ return !!(t && t.closest && t.closest(".protected-content")); }
  function inField(t){ return !!(t && t.closest && t.closest("input, textarea, select, [contenteditable='true']")); }
  var lastNotice = 0;
  function notice(){
    var now = Date.now(); if(now - lastNotice < 2500) return; lastNotice = now;
    var d = document.createElement("div");
    d.className = "copy-notice"; d.setAttribute("role","status");
    d.textContent = "Copying is disabled for course content.";
    document.body.appendChild(d);
    setTimeout(function(){ d.remove(); }, 2600);
  }
  ["copy","cut"].forEach(function(type){
    document.addEventListener(type, function(e){
      if(inProtected(e.target) && !inField(e.target)){ e.preventDefault(); notice(); }
    }, true);
  });
  document.addEventListener("contextmenu", function(e){
    if(inProtected(e.target) && !inField(e.target)) e.preventDefault();
  }, true);
  document.addEventListener("dragstart", function(e){
    if(inProtected(e.target) && !inField(e.target)) e.preventDefault();
  }, true);
})();
</script>
</body>
</html>

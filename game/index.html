const S = {
  run: null,        // active run state (see newRun())
  pack: null,       // decrypted premium pack {scenarios, modules}
  licenseOk: false, // a valid premium license unlocked this device
  license: null,    // { tier, expiry }
  licenseMsg: "",   // status line shown under the key box
  pending: null,    // reserved by renderOutcome
  pendingCC: null,  // active close-call branch choices

function newRun() {
  return {
    victims: 0, heat: 0,
    streak: 0, bestStreak: 0, maxHeat: 0,
    scIdx: 0, nodeIdx: 0,
    scenVictims: {},   // scenario id -> victims gained (for favoriteScam)
    flagsShown: []     // defense briefs shown (for the end-of-run debrief)
  };
}

/** Scenarios playable in this run, in manifest order: the free set,
    plus premium scenarios ONLY when the pack is decrypted. */
function getRunScenarios() {
  const list = SCENARIOS_FREE.slice(0, CONFIG.FREE_SCENARIO_COUNT);
  if (S.pack && Array.isArray(S.pack.scenarios)) {
    const byId = {};
    S.pack.scenarios.forEach(s => { if (s && typeof s.id === "string") byId[s.id] = s; });
    CONTENT_MANIFEST
      .filter(e => e.type === "scenario" && e.tier === "premium")
      .sort((a, b) => a.order - b.order)
      .forEach(e => { if (byId[e.id]) list.push(byId[e.id]); });
  }
  return list;
}

/** THE tier gate. Free entries are always unlocked; premium entries
    require a verified license AND the decrypted pack in memory AND
    that item's content actually present in the pack. Nothing premium
    is readable without all three. */
function isUnlocked(id) {
  const e = CONTENT_MANIFEST.find(x => x.id === id);
  if (!e) return false;
  if (e.tier !== "premium") return true;
  if (S.licenseOk !== true || !S.pack) return false;
  if (e.type === "scenario")
    return Array.isArray(S.pack.scenarios) &&
      S.pack.scenarios.some(s => s && s.id === id);
  const m = Array.isArray(S.pack.modules) ? S.pack.modules[e.order - 103] : null;
  return !!(m && typeof m.body === "string");
}

/**
 * Apply one pick's deltas. Returns { streakBonus, busted }.
 * - victims/heat are clamped at 0 (laying low can't go negative).
 * - heat ABOVE STREAK_HEAT_LIMIT breaks the streak; at-or-below keeps it.
 * - every STREAK_EVERY clean picks in a row award STREAK_BONUS_VICTIMS.
 * - busted when heat reaches HEAT_MAX.
 */
function applyDeltas(v, h) {
  const r = S.run;
  v = (typeof v === "number" && isFinite(v)) ? v : 0;
  h = (typeof h === "number" && isFinite(h)) ? h : 0;
  r.victims = Math.max(0, r.victims + v);
  r.heat = Math.max(0, r.heat + h);
  if (r.heat > r.maxHeat) r.maxHeat = r.heat;
  let streakBonus = 0;
  if (h > CONFIG.STREAK_HEAT_LIMIT) {
    r.streak = 0;
  } else {
    r.streak += 1;
    if (r.streak > r.bestStreak) r.bestStreak = r.streak;
    if (r.streak % CONFIG.STREAK_EVERY === 0) {
      streakBonus = CONFIG.STREAK_BONUS_VICTIMS;
      r.victims += streakBonus;
    }
  }
  return { streakBonus: streakBonus, busted: r.heat >= CONFIG.HEAT_MAX };

/** Heat warning text for the current heat level, or null. Thresholds

function heatWarning() {
  const h = S.run ? S.run.heat : 0;
  if (h >= CONFIG.HEAT_WARN_3) return "that was TOO close";
  if (h >= CONFIG.HEAT_WARN_2) return "someone filed a report with your number on it";
  if (h >= CONFIG.HEAT_WARN_1) return "feds are sniffing around";
  return null;
}

/** Rank for a victim count. RANKS is ascending by min; a score lands
    in the highest rank whose min it reaches (edge: exactly min counts). */
function rankFor(victims) {
  let rank = CONFIG.RANKS[0];
  for (const r of CONFIG.RANKS) { if (victims >= r.min) rank = r; }
  return rank;
}

/** Title of the scenario that gained the most victims this run. */
function favoriteScam() {
  const r = S.run;
  if (!r) return "—";
  let bestId = null, bestV = 0;
  for (const id of Object.keys(r.scenVictims)) {
    if (r.scenVictims[id] > bestV) { bestV = r.scenVictims[id]; bestId = id; }
  }
  if (!bestId) return "—";
  const sc = getRunScenarios().find(s => s.id === bestId);
  return sc ? sc.title : bestId;
}

function escapeHtml(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;")
    .replace(/>/g, "&gt;").replace(/"/g, "&quot;");

 * Premium modules are matched by manifest order: build-pack sorts

 * at orders 103..118 — keep those aligned. Returns null when the
 * module can't be served (fail closed; never leak pack internals).

function getModuleBody(entry) {
  let body = null;
  if (entry.tier === "free") {
    const m = COURSES_FREE.find(c => c.id === entry.id);
    if (m) body = m.body;
  } else if (S.pack && Array.isArray(S.pack.modules)) {
    const m = S.pack.modules[entry.order - 103];
    if (m && typeof m.body === "string") body = m.body;
  }
  return body === null ? null : escapeHtml(body);
}

 * key, decrypt the premium pack. Throws a user-facing Error on any
 * failure — never leaves a half-unlocked state.

async function unlockFromKey(str) {
  const v = await License.verifyLicense(str, CONFIG.LICENSE_PUBLIC_KEY_HEX);

  const pack = await License.decryptPack(PREMIUM_PACK_B64, Kc);

    throw new Error("Premium pack is corrupt.");

    if (!s || typeof s.id !== "string" || !Array.isArray(s.nodes) || !s.defense)

  }
  S.license = { tier: v.tier, expiry: v.expiry };
  S.pack = pack;
  S.licenseOk = true;
}

async function restoreLicense() {
  let str = null;
  try { str = localStorage.getItem(CONFIG.LICENSE_STORAGE_KEY); } catch (e) { str = null; }

  try { await unlockFromKey(str); }
  catch (e) { try { localStorage.removeItem(CONFIG.LICENSE_STORAGE_KEY); } catch (e2) {} }
}

function removeLicense() {
  S.licenseOk = false;
  S.license = null;
  S.pack = null;
  try { localStorage.removeItem(CONFIG.LICENSE_STORAGE_KEY); } catch (e) {}
}

        '<span class="lk">' + (locked ? "🔒" : "▶") + "</span></div>";
    }).join("");
  const courseRows = CONTENT_MANIFEST.filter(e => e.type === "course")
    .sort((a, b) => a.order - b.order).map(m => {
      const locked = !isUnlocked(m.id);
      return '<div class="lockrow' + (locked ? " locked" : "") + '" onclick="uiCourseRow(\'' + m.id + '\')">' +
        "<span>" + m.title + "</span>" +
        '<span class="lk">' + (locked ? "🔒" : "📖") + "</span></div>";
    }).join("");
  const licBox = S.licenseOk
    ? '<div class="okbox">✅ <b>PREMIUM ACTIVE</b> — expires ' +
      new Date(S.license.expiry * 1000).toLocaleDateString() + '. All 8 scams + 16 field-manual modules unlocked.</div>' +
      '<button class="btn ghost" onclick="uiRemoveLicense()">Remove license from this device</button>'
    : '<div class="card"><div class="tag">LICENSE KEY</div>' +
      '<div class="brief">Got a premium key? Paste it below. Your key <b>decrypts</b> the premium content — without it, it\'s just noise. Guard it like a password.</div>' +
      '<div class="mt"><textarea class="keybox" id="keyinput" placeholder="Paste license key here..."></textarea></div>' +
      '<label class="checkrow"><input type="checkbox" id="remember"> <span>Remember on this device (stored only in this browser — uncheck to keep this session only)</span></label>' +
      '<button class="btn primary" onclick="uiUnlock()">UNLOCK PREMIUM</button>' +
      (S.licenseMsg ? '<div class="' + (S.licenseOk ? "okbox" : "warn") + '">' + S.licenseMsg + "</div>" : "") +
      '<div class="center"><a href="buy.html" style="color:var(--purple-l)">Don\'t have a key? Get premium — $5 in BTC →</a></div></div>';

  app().innerHTML =
    '<div class="center"><h1>YOU ARE THE<br><span class="p">SCAMMER</span> 🥷</h1></div>' +
    '<div class="banner"><b>DEFENSIVE TRAINING.</b> You play the villain to learn how to beat him. ' +
    "Every scam you run ends with a debrief on exactly how your victims could have spotted you. " +
    "That's the point. <b>Don't be the scammer. Beat the scammer.</b></div>" +
    '<button class="btn primary" onclick="uiStart()">▶ START RUN</button>' +
    '<div class="card"><div class="tag">THE 8 SCAMS</div>' + scenRows + "</div>" +
    '<div class="card"><div class="tag">FIELD MANUAL — DEFENSE COURSE</div>' + courseRows + "</div>" +
    licBox;
}

function uiScenRow(id) { if (isUnlocked(id)) uiStart(); else renderUpgrade(); }
function uiCourseRow(id) { if (isUnlocked(id)) renderModule(id); else renderUpgrade(); }

/* ---------- run flow ---------- */
function uiStart() {
  S.run = newRun();
  const scs = getRunScenarios();
  if (!scs.length) { renderUpgrade(); return; }
  renderBriefing();
}

function curScenario() { return getRunScenarios()[S.run.scIdx]; }

function renderBriefing() {
  renderHUD();
  const sc = curScenario();
  app().innerHTML =
    '<div class="card"><div class="tag">' + sc.tag + "</div>" +
    "<h2>" + sc.title + "</h2>" +
    sc.briefing.map(b => '<p class="brief">' + b + "</p>").join("") +
    '<button class="btn primary" onclick="uiBegin()">RUN IT 😈</button></div>';
}

function uiBegin() { S.run.nodeIdx = 0; renderNode(); }

function deltaHtml(o) {
  const parts = [];
  if (o.v > 0) parts.push('<span class="dv">+' + o.v + " victims</span>");
  if (o.v < 0) parts.push('<span class="dv">' + o.v + " victims</span>");
  if (o.h > 0) parts.push('<span class="dh">+' + o.h + " heat</span>");
  if (o.h < 0) parts.push('<span class="dv">' + o.h + " heat</span>");
  return '<span class="delta">' + parts.join(" · ") + "</span>";
}

function renderNode() {
  renderHUD();
  S.answered = false; /* PASS 2: fresh pick screen — accept one tap */
  document.getElementById("app").classList.remove("answering");
  const sc = curScenario(), node = sc.nodes[S.run.nodeIdx];
  app().innerHTML =
    '<div class="card"><div class="tag">' + sc.tag + " — STEP " + (S.run.nodeIdx + 1) + "/" + sc.nodes.length + "</div>" +
    "<h2>" + node.prompt + "</h2>" +
    node.options.map((o, i) =>
      '<button class="btn" onclick="uiPick(' + i + ')">' + deltaHtml(o) +
      '<span class="opt-label">' + o.label + "</span>" +
      '<span class="sub">' + o.sub + "</span></button>").join("") + "</div>";
}

function trackVictims(scId, gained) {
  if (gained > 0) S.run.scenVictims[scId] = (S.run.scenVictims[scId] || 0) + gained;
}

function uiPick(i) {
  if (S.answered) return; /* PASS 2: ignore double-taps while the outcome is pending */
  S.answered = true;
  const sc = curScenario(), node = sc.nodes[S.run.nodeIdx], opt = node.options[i];
  const before = S.run.victims;
  const res = applyDeltas(opt.v, opt.h);
  trackVictims(sc.id, S.run.victims - before);
  /* PASS 2: tap feedback on the chosen option; freeze the rest until the next screen */
  const btns = document.querySelectorAll("#app .btn");
  if (btns[i]) btns[i].classList.add("picked");
  document.getElementById("app").classList.add("answering");
  if (opt.v > 0) popup("+" + opt.v + " victims", "good");
  if (opt.h > 0) { popup("+" + opt.h + " heat", "bad"); }
  if (opt.h < 0) popup(opt.h + " heat", "good");
  if (res.streakBonus) setTimeout(() => popup("🔥 STREAK x" + S.run.streak + "  +" + res.streakBonus, "streak"), 350);
  renderHUD();
  const warn = heatWarning();
  if (res.busted) { setTimeout(() => renderBusted(), 650); return; }
  setTimeout(() => {
    if (opt.closeCall) renderCloseCall(opt.closeCall, sc);
    else renderOutcome(opt.out || [], { next: "node" }, warn);
  }, 650);
}

function renderOutcome(lines, pending, warn) {
  S.pending = pending;
  /* PASS 3: the pick is resolved — unfreeze buttons or CONTINUE is dead
     (pointer-events:none from the pending-pick freeze would persist). */
  document.getElementById("app").classList.remove("answering");
  renderHUD();
  app().innerHTML =
    '<div class="card"><div class="tag">IT PLAYS OUT</div>' +
    lines.map(l => {
      const m = l.match(/^([A-Z][A-Z .'-]+):\s*(.*)$/);
      return m ? '<div class="out"><span class="who">' + m[1] + "</span><br>" + m[2] + "</div>"
               : '<div class="out">' + l + "</div>";
    }).join("") +
    (warn ? '<div class="warn">⚠️ ' + warn + "</div>" : "") +
    '<button class="btn primary" onclick="uiContinue()">CONTINUE →</button></div>';
}

function renderCloseCall(cc, sc) {
  S.pendingCC = { cc: cc, sc: sc };
  S.answered = false; /* PASS 2: fresh pick screen — accept one tap */
  renderHUD();
  /* PASS 2: delta badges sit top-right, matching the node option buttons */
  const branch = b =>
    '<button class="btn" onclick="uiCC(\'' + b + '\')">' + deltaHtml(cc[b]) +
    '<span class="opt-label">' + cc[b].label + "</span>" +
    '<span class="sub">' + cc[b].sub + "</span></button>";
  app().innerHTML =
    '<div class="card"><div class="tag">⚠️ CLOSE CALL</div>' +
    "<h2>Too close...</h2>" +
    '<div class="warn">' + cc.text + "</div>" +
    branch("layLow") + branch("push") + "</div>";
  document.getElementById("app").classList.remove("answering");
  document.getElementById("app").classList.remove("shake");
  void document.getElementById("app").offsetWidth;
  document.getElementById("app").classList.add("shake");
}

function uiCC(which) {
  if (S.answered) return; /* PASS 2: ignore double-taps while the outcome is pending */
  S.answered = true;
  const { cc, sc } = S.pendingCC, br = cc[which];
  const before = S.run.victims;
  const res = applyDeltas(br.v, br.h);
  trackVictims(sc.id, S.run.victims - before);
  /* PASS 2: tap feedback on the chosen branch; freeze the other until the next screen */
  document.querySelectorAll("#app .btn").forEach(b => {
    if (b.getAttribute("onclick") === "uiCC('" + which + "')") b.classList.add("picked");
  });
  document.getElementById("app").classList.add("answering");
  if (br.v > 0) popup("+" + br.v + " victims", "good");
  if (br.h > 0) popup("+" + br.h + " heat", "bad");
  if (br.h < 0) popup(br.h + " heat", "good");
  /* PASS 2: streak-bonus popup (uiPick had it; uiCC was missing it) */
  if (res.streakBonus) setTimeout(() => popup("🔥 STREAK x" + S.run.streak + "  +" + res.streakBonus, "streak"), 350);
  renderHUD();
  const warn = heatWarning();
  if (res.busted) { setTimeout(() => renderBusted(), 650); return; }
  setTimeout(() => renderOutcome(br.out, { next: "node" }, warn), 650);
}

function uiContinue() {
  const scs = getRunScenarios(), sc = curScenario();
  if (S.run.nodeIdx < sc.nodes.length - 1) { S.run.nodeIdx++; renderNode(); }
  else renderDefense(sc);
}

function renderDefense(sc) {
  /* PASS 3: lift the pending-pick button freeze (see renderOutcome). */
  document.getElementById("app").classList.remove("answering");
  renderHUD();
  S.run.flagsShown.push({ scenario: sc.title, flags: sc.defense.flags });
  const scs = getRunScenarios();
  const last = S.run.scIdx >= scs.length - 1;
  app().innerHTML =
    '<div class="card"><div class="tag">🛡️ DEFENSE BRIEF</div>' +
    "<h2>" + sc.defense.title + "</h2>" +
    '<p class="brief">Crew debrief. Here\'s everywhere you got sloppy — and exactly how your victims could have burned you:</p>' +
    sc.defense.flags.map(f =>
      '<div class="out flag"><span class="t">🚩 ' + f.t + "</span><p>" + f.p + "</p></div>").join("") +
    '<button class="btn primary" onclick="uiDefenseNext()">' +
    (last ? "FINISH THE RUN →" : "NEXT SCAM →") + "</button></div>";
}

function uiDefenseNext() {
  const scs = getRunScenarios();
  if (S.run.scIdx < scs.length - 1) { S.run.scIdx++; renderBriefing(); }
  else if (!S.pack) renderUpgrade();
  else renderEnd(false);
}

/* ---------- upgrade ---------- */
function renderUpgrade() {
  /* PASS 3: lift the pending-pick button freeze (see renderOutcome). */
  document.getElementById("app").classList.remove("answering");
  S.run = null; renderHUD();
  const premScen = CONTENT_MANIFEST.filter(e => e.type === "scenario" && e.tier === "premium")
    .sort((a, b) => a.order - b.order).map(m => "<div>🔒 " + m.title + "</div>").join("");
  app().innerHTML =
    '<div class="card center"><div class="tag">PREMIUM CONTENT</div>' +
    "<h1>🔒</h1><h2>Want the full empire?</h2>" +
    '<p class="brief">Your free run covers the first 3 scams. Premium unlocks the rest:</p>' +
    '<div class="brief" style="text-align:left;display:inline-block">' + premScen +
    "<div>🔒 16 field-manual defense modules</div></div>" +
    '<div class="banner"><b>How it works:</b> your license key <b>decrypts</b> the premium content right on your device. ' +
    "Without it, it's just noise. Guard it like a password.</div>" +
    '<a href="buy.html" style="text-decoration:none"><button class="btn primary">GET PREMIUM — $5 IN BTC →</button></a>' +
    '<button class="btn ghost" onclick="renderTitle()">Back to free stuff</button></div>';
}

/* ---------- busted ---------- */
function renderBusted() {
  /* PASS 3: lift the pending-pick button freeze (see renderOutcome). */
  document.getElementById("app").classList.remove("answering");
  const r = S.run, scs = getRunScenarios();
  const cleared = r.scIdx;
  app().innerHTML =
    '<div class="card center"><div class="tag">🚨 BUSTED</div>' +
    "<h1>BUSTED.</h1>" +
    '<p class="brief">Heat hit ' + CONFIG.HEAT_MAX + '. The feds kicked the door at 6 AM. ' +
    "Your laptop is in an evidence bag. The crew is pretending they never met you.</p>" +
    '<p class="brief">On the bright side: every victim you scammed is a lesson you can now use to <b>spot</b> the next scammer. That\'s the whole point of this game.</p>' +
    '<div class="stat-grid">' +
    '<div class="stat"><div class="v">' + r.victims + '</div><div class="k">VICTIMS</div></div>' +
    '<div class="stat"><div class="v">' + cleared + "/" + scs.length + '</div><div class="k">SCAMS CLEARED</div></div>' +
    '<div class="stat"><div class="v">x' + r.bestStreak + '</div><div class="k">BEST STREAK</div></div>' +
    '<div class="stat"><div class="v">' + r.maxHeat + '</div><div class="k">MAX HEAT</div></div></div>' +
    '<button class="btn primary" onclick="uiStart()">RUN IT BACK 🔁</button>' +
    (!S.pack ? '<button class="btn ghost" onclick="renderUpgrade()">Unlock all 8 scams — premium</button>' : "") +
    '<button class="btn ghost" onclick="renderTitle()">Title screen</button></div>';
  renderHUD();
}

/* ---------- end of run ---------- */
function renderEnd() {
  /* PASS 3: lift the pending-pick button freeze (see renderOutcome). */
  document.getElementById("app").classList.remove("answering");
  const r = S.run, rank = rankFor(r.victims);
  const debrief = r.flagsShown.map(g =>
    "<h2>" + g.scenario + "</h2>" +
    g.flags.map(f => '<div class="out flag"><span class="t">🚩 ' + f.t + "</span><p>" + f.p + "</p></div>").join("")
  ).join("");
  const share = buildShareText(rank);
  app().innerHTML =
    '<div class="card center"><div class="tag">👑 RUN COMPLETE</div>' +
    "<h2>" + rank.title + "</h2>" +
    '<p class="brief"><i>' + rank.flavor + "</i></p>" +
    '<div class="big-score">' + r.victims + "</div><div class='brief'>victims scammed</div>" +
    '<div class="stat-grid">' +
    '<div class="stat"><div class="v">' + r.maxHeat + '</div><div class="k">HEAT SURVIVED</div></div>' +
    '<div class="stat"><div class="v">x' + r.bestStreak + '</div><div class="k">BEST STREAK</div></div>' +
    '<div class="stat"><div class="v" style="font-size:16px">' + favoriteScam() + '</div><div class="k">FAVORITE SCAM</div></div>' +
    '<div class="stat"><div class="v">' + r.flagsShown.length + "/8</div><div class=\"k\">SCAMS CLEARED</div></div></div>" +
    '<div class="tag">SHARE YOUR RUN</div><div class="sharebox" id="sharebox">' + share + "</div>" +
    '<button class="btn primary" onclick="uiCopy()">📋 COPY SUMMARY</button>' +
    '<div class="tag mt">FULL RED-FLAG DEBRIEF</div><div style="text-align:left">' + debrief + "</div>" +
    '<button class="btn primary" onclick="uiStart()">RUN IT AGAIN 🔁</button>' +
    '<button class="btn ghost" onclick="renderTitle()">Title screen</button></div>';
  renderHUD();
}

function buildShareText(rank) {
  return "🥷 YOU ARE THE SCAMMER — my run\n" +
    "Rank: " + rank.title + " (" + S.run.victims + " victims)\n" +
    "Heat survived: " + S.run.maxHeat + "/" + CONFIG.HEAT_MAX +
    " | Best streak: x" + S.run.bestStreak + "\n" +
    "Favorite scam: " + favoriteScam() + "\n" +
    "I played the villain to learn how to beat him. 🛡️";
}

function uiCopy() {
  const t = document.getElementById("sharebox").textContent;
  const done = () => popup("Copied! 📋", "good");
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(t).then(done).catch(() => fallbackCopy(t, done));
  } else fallbackCopy(t, done);
}
function fallbackCopy(t, done) {
  const ta = document.createElement("textarea");
  ta.value = t; document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); done(); } catch (e) {}
  ta.remove();
}

/* ---------- field manual ---------- */
function renderModule(id) {
  const entry = CONTENT_MANIFEST.find(e => e.id === id);
  if (!entry || !isUnlocked(id)) { renderUpgrade(); return; }
  /* PASS 3: lift the pending-pick button freeze (see renderOutcome). */
  document.getElementById("app").classList.remove("answering");
  const body = getModuleBody(entry);
  app().innerHTML =
    '<div class="card"><div class="tag">📖 FIELD MANUAL</div>' +
    "<h2>" + entry.title + "</h2>" +
    (body === null
      ? '<div class="warn">This module failed to load — the premium pack may be corrupt. Try re-entering your license key.</div>'
      : '<div class="module-body">' + body + "</div>") +
    '<button class="btn primary mt" onclick="renderTitle()">← BACK</button></div>';
  window.scrollTo(0, 0);
}

/* ---------- license UI ---------- */
async function uiUnlock() {
  const str = document.getElementById("keyinput").value;
  const remember = document.getElementById("remember").checked;
  S.licenseMsg = "Checking key..."; renderTitleKeep();
  try {
    await unlockFromKey(str);
    /* PASS 3: a refused write (quota, private mode) must not fail silently —
       the session is still unlocked in memory; say so. */
    let saveNote = "";
    if (remember) {
      try { localStorage.setItem(CONFIG.LICENSE_STORAGE_KEY, str.trim()); }
      catch (e) { saveNote = " (Note: this browser refused to store the key — you stay unlocked for this session only.)"; }
    }
    else { try { localStorage.removeItem(CONFIG.LICENSE_STORAGE_KEY); } catch (e) {} }
    S.licenseMsg = "Premium unlocked — welcome to the big leagues. 😈" + saveNote;
  } catch (e) { S.licenseMsg = e.message; }
  renderTitle();
}
/* re-render title but keep the typed key in place while checking */
function renderTitleKeep() {
  const v = document.getElementById("keyinput") ? document.getElementById("keyinput").value : "";
  const c = document.getElementById("remember") ? document.getElementById("remember").checked : false;
  renderTitle();
  const ki = document.getElementById("keyinput");
  if (ki) { ki.value = v; document.getElementById("remember").checked = c; }
}
function uiRemoveLicense() {
  removeLicense();
  S.licenseMsg = "License removed from this device.";
  renderTitle();
}

/* ---------- boot ---------- */
setFooter();
restoreLicense().then(() => renderTitle()).catch(() => renderTitle());
</script>

  { id: "course-01", title: "Spot the Phish: The 60-Second Email Check", body:
"MODULE OVERVIEW\nLevel: Foundations\nTime: 20 min\nPrerequisites: None\nPhishing is a fake email, or a fake site it sends you to, built to harvest your login. The account locked message is the classic lure: official-looking, panic-driven, with one link. This module gives you a 60-second check for any email.\n\nLEARNING OBJECTIVES\nAfter this module you can:\n- Run the five-step, 60-second check on any email\n- Read a sender address and link instead of trusting a display name\n- Explain why urgency is a tool used against you\n- Apply the one habit: never log in from an email link\n- Act correctly after you entered a password\n\nLESSON 1 \u2014 THE 60-SECOND CHECK\nWork in order; stop when one step fails.\n\nStep 1, sender address. Not the display name, the address. security@yourbank-secure.com is not your bank. Look for added words, hyphens, and misspellings.\nStep 2, the greeting. Dear Customer means a mass blast.\nStep 3, urgency. Locked in 24 hours! Panic is the point; it stops you checking step 1. Treat a deadline as a reason to slow down.\nStep 4, the link. Hover, or press and hold; do not tap. The real domain sits right before the first single slash. yourbank.com.verify-login.ru is not yourbank.com; it is a subdomain there.\nStep 5, the ask. Banks never ask for passwords, PINs, or full Social Security numbers by email. Ever. If a page asks, you have your answer.\n\nCASE BREAKDOWN: THE LOCKED ACCOUNT\nWhat happened: Dana gets an email with her bank logo: Unusual sign-in. Account locked today. She clicks, lands on a page that looks like her bank, and enters her username, password, and card number. It says Verified and sends her to the real bank site. That login is used that evening.\nWhere it could have stopped: Step 1, the sender domain had an extra word; step 4, the link did not go to her bank; step 5, the page asked for a full card number.\nThe signal most people miss: The redirect to the real site reads as proof. It is the opposite: the fake page has what it needs.\n\nWHAT TO DO INSTEAD\n- Close the email. Open your bank app, or type the address yourself. A real problem will be waiting in your account.\n- If nothing is there, it was fake. Report it, then delete it.\n\nCOMMON MISTAKE: Judging an email by how it looks. Logos are copied in seconds; look is the cheapest part to fake.\n\nLESSON 2 \u2014 THE ONE HABIT\nThe one habit: never log in from an email link. Open the app or type the address yourself. This defeats nearly all phishing: it breaks the chain at the only step the sender controls, where the link takes you.\nUse it for shared documents and resets you did not request.\n\nCASE BREAKDOWN: THE SHARED DOCUMENT\nWhat happened: Marcus gets a shared invoice from a name he recognizes. The sign-in page asks for his email password. He enters it. Nothing opens. By morning, his contacts are getting the same message from his account.\nWhere it could have stopped: At the ask; a document viewer does not need his email password. Or with the one habit: opening his files in his own app, where no invoice waited.\nThe signal most people miss: The sender name was real because that account had been taken over the same way.\n\nIF YOU CLICKED\n- Clicked but entered nothing? Close the page.\n- Entered a password? Change it immediately, from the real app, and anywhere you reused it.\n- Turn on two-factor authentication, app-based, not SMS, if you can.\n- Watch the account for a week; report the phish to your bank and reportphishing@apwg.org.\n\nCOMMON MISTAKE: Changing the password through the same email link; you may hand the new one to that fake page.\n\nHANDS-ON EXERCISE\nYou receive an email from Chase Secure Team at alerts@chase-secure-center.com: Dear Customer, verify within 24 hours.\nDecision points: Do the greeting and deadline decide it? No; warnings, not verdicts. Which step ends it? Step 1: the domain has extra words.\nCorrect path: Fail it at the sender address, go direct in the bank app, find no alert, report and delete it.\n\nKNOWLEDGE CHECK\n[CHECK]\nQ: An email shows your bank name and logo. What proves it is real?\nA: The logo and professional design\nB: Sender and link matching the real bank domain, and no password or PIN request\nC: A footer with a real street address\nANSWER: B\nFEEDBACK: Design can be copied; domain and ask are what you verify. The logo is tempting, but appearance is easiest to fake.\n[/CHECK]\n[CHECK]\nQ: A link reads yourbank.com.verify-login.ru. Where does it go?\nA: Your bank, because yourbank.com appears first\nB: A secure page your bank owns\nC: A site under the ending domain, not your bank\nANSWER: C\nFEEDBACK: Read the ending domain before the first slash. A familiar name first is tempting, but it can be a subdomain on another site.\n[/CHECK]\n[CHECK]\nQ: You entered your password on a page an email sent you to. What do you do first?\nA: Wait to see if anything happens\nB: Change the password through the same link\nC: Open the real app yourself and change it there, and anywhere you reused it\nANSWER: C\nFEEDBACK: Speed matters, but only through a session you opened. The same link is tempting, yet it can hand your new password to the fake page.\n[/CHECK]\n\nKEY TAKEAWAYS\n- Check the address, not the display name; the link, not the button; the ask, not the design.\n- Urgency is a tool used against you. Slow down.\n- Never log in from an email link. Go direct.\n- A familiar sender name proves nothing.\n- If you entered a password, change it from a session you opened, everywhere reused, then turn on 2FA.\n\nGLOSSARY\nPhishing - A fake message or site designed to steal a login.\nDomain - The core part of an address or link, such as yourbank.com.\nSubdomain - Words before a domain; they can make a fake link look familiar.\nHover - Resting a pointer, or pressing and holding, to preview a link\n2FA - Two-factor authentication: a second proof beyond your password.\nDisplay name - The name shown by an email; the sender chooses it.\n\nFURTHER READING\nFTC: https://consumer.ftc.gov\nReport fraud: https://reportfraud.ftc.gov\nCISA: https://www.cisa.gov\n\nCERTIFICATION ALIGNMENT\nSupports: CompTIA Security+ (SY0-701) Domain 2 \u2014 social engineering and phishing recognition.\nAlignment means this module teaches the knowledge these certifications test in this area. Completing it does not by itself earn any certification \u2014 vendor exams are taken separately through the certification body." },

"MODULE OVERVIEW\nLevel: Foundations\nTime: 20 minutes\nPrerequisites: None\n\nSmishing is phishing by text. Missed package, bank alert, toll due: all designed to make you tap before you think. A text feels personal; that trust is what the sender borrows. This module teaches the tells and the rules.\n\nLEARNING OBJECTIVES\nAfter this module you can:\n- Name the four tells of a scam text\n- Explain why a small fee is the trap\n- Handle an unexpected login code correctly\n- Report a scam text to 7726 (SPAM)\n- Act if you entered card or password details\n\nLESSON 1 \u2014 THE TELLS\nLinks from strangers, especially shortened ones (bit.ly, t.ly) that hide where they go. Legit companies text from short codes, not 10-digit numbers.\nThe fee trap. Pay a $1.50 redelivery fee. The fee is not the scam; the card form is. A tiny charge feels too small to question, so you type your card details into a page the sender controls, to be used or sold.\nThe reply hook. Reply YES or STOP. Either confirms your number is live and read by a human, making it worth more to the next sender. Do not reply.\nUnrequested codes. An unrequested login code means someone is trying to log in as you, right now. Never read one out; no company will ask. Enter a code only if you started the sign-in.\n\nCASE BREAKDOWN: THE TOLL NOTICE\nWhat happened: Priya gets a text: Unpaid toll, $3.85, pay in 12 hours or face a $50 penalty, with a link. She drove a toll road last month, so she pays. Days later, purchases she never made appear on that card.\nWhere it could have stopped: At the link; toll agencies do not collect debts via texted links. Or at the source: a 10-digit number, not a short code.\nThe signal most people miss: The real small charge looks like proof the text was genuine. It is bait; it keeps you from reporting the card while its details are used elsewhere.\n\nWHAT TO DO INSTEAD\n- Stop. Do not tap or reply.\n- Open the official app and check there. No notice means the text was fake.\n- Forward it to 7726 (SPAM), then block and delete.\n\nCOMMON MISTAKE: Replying STOP. On a scam text it is not an unsubscribe button; it signals a person is listening.\n\nLESSON 2 \u2014 THE RULES\nSenders change wording weekly. These rules do not:\n- Do not tap links in unexpected texts. Open the official app instead.\n- Do not reply, not even STOP. It confirms you are real. Forward to 7726 (SPAM), then block.\n- Real bank alerts never ask for passwords or full card numbers by text, or send you to a page to verify details.\n- Carriers, toll agencies, and the DMV do not collect debts via texted links. Your carrier never texts a payment link for your bill either.\n- Treat a text deadline as the tell. Real bills have due dates in your account.\n\nCASE BREAKDOWN: THE CODE REQUEST\nWhat happened: Ben gets an unrequested login code. A minute later a caller claiming to be from his bank asks him to read it out to cancel a blocked sign-in. Ben does. The caller uses it, live, to finish signing in as Ben.\nWhere it could have stopped: At the first text; an unrequested code means an attack is in progress, so sign in yourself and change the password. Or at the request: a code is a key, never read out.\nThe signal most people miss: The caller knew a code had been sent, which felt like inside knowledge. He knew because he triggered it.\n\nWHAT TO SAY\nIf anyone asks for a code, password, or card number to verify you, say: I do not give codes or passwords on calls or texts. I will contact the company directly. Then hang up.\n\nCOMMON MISTAKE: Treating a login code as harmless, like a reference number. It is the second half of your password: whoever has both is you, to the account.\n\nHANDS-ON EXERCISE\nA text arrives: USPS, your package could not be delivered. Pay the $1.50 fee here, with a shortened link.\nDecision points: You are expecting a package; does that clear it? No; senders blast thousands of numbers. Is the small fee safe? No; it is bait, the card form is the trap.\nCorrect path: Check tracking in the postal app yourself; nothing there needs a fee. Forward to 7726, block, delete.\n\nKNOWLEDGE CHECK\n[CHECK]\nQ: What do you do first with a scam text?\nA: Reply STOP to end it\nB: Forward it to 7726, then block and delete it\nC: Call back and ask who they are\nANSWER: B\nFEEDBACK: Forwarding to 7726 reports it to your carrier so the campaign can be blocked. Replying STOP is tempting, but any reply confirms your number is live.\n[/CHECK]\n[CHECK]\nQ: A text asks for a $1.50 redelivery fee. What is the scam?\nA: The fee itself\nB: A late fee added later\nC: The card form, which captures your full card details\nANSWER: C\nFEEDBACK: The small fee makes the form feel safe. The fee is tempting to dismiss, but the prize is your card details.\n[/CHECK]\n[CHECK]\nQ: A caller asks you to read out an unrequested login code to cancel a sign-in. What do you do?\nA: Read it; he is trying to help\nB: Hang up, sign in yourself, and change your password\nC: Ignore it; a code alone means nothing\nANSWER: B\nFEEDBACK: The caller triggered the code and needs it to sign in as you. Reading it out is tempting, but it completes his login; it cancels nothing.\n[/CHECK]\n\nKEY TAKEAWAYS\n- Never tap the link in an unexpected text. Go direct in the official app.\n- Never reply, not even STOP. Forward to 7726 (SPAM), block, delete.\n- Carriers, toll agencies, and the DMV do not collect money through texted links.\n- A login code is a key. Never read one to a caller.\n- If you entered card details, call your bank now; if a password, change it everywhere reused.\n\nGLOSSARY\nSmishing - Phishing by text.\nShort code - The short number companies text from.\nShortened link - A compressed link, such as bit.ly, hiding its destination.\n7726 - The number, spelling SPAM, for forwarding scam texts.\nLogin code - A one-time code proving a sign-in is yours.\nLook-alike domain - An address made to resemble a real one, with small changes.\n\nFURTHER READING\nFTC: https://consumer.ftc.gov\nReport fraud: https://reportfraud.ftc.gov\nFBI IC3: https://www.ic3.gov\n\nCERTIFICATION ALIGNMENT\nSupports: CompTIA Security+ (SY0-701) Domain 2 \u2014 smishing and messaging-based social engineering.\nAlignment means this module teaches the knowledge these certifications test in this area. Completing it does not by itself earn any certification \u2014 vendor exams are taken separately through the certification body." },

"MODULE OVERVIEW\nLevel: Foundations\nTime: 20 minutes\nPrerequisites: None\n\nThe scam: someone calls claiming to be Microsoft, Apple, or your security team. Your computer sent error reports. They will fix it if you give access and pay. The same script arrives as a pop-up with a phone number. This module walks the script, shows the trick used as proof, and gives one rule that ends every version.\n\nLEARNING OBJECTIVES\nAfter this module you can:\n- Recognize the script's four steps\n- Explain why Event Viewer warnings are normal\n- State who never cold-calls you\n- End a call or pop-up well\n- Act if you gave access\n\nLESSON 1 \u2014 THE SCRIPT\nStep 1, hook. Your PC is infected. Your license expired. Illegal activity on your IP. The claim changes; the pressure does not.\nStep 2, proof. They walk you to Windows Event Viewer and show warnings, calling them viruses. Every Windows computer shows these; a normal log of routine notices.\nStep 3, access. Install this remote tool so I can fix it. Once you do, they are inside your computer, showing staged evidence while work happens off-screen.\nStep 4, payment. A fee by gift cards, wire, or card. Or the refund turn: they send too much and ask for the difference back. That refund was never real, so what you send is your money.\n\nCASE BREAKDOWN: THE POP-UP\nWhat happened: Rosa's screen freezes under a warning: Computer locked. Call support now. Do not restart. She calls. The technician has her open Event Viewer, gasps at the warnings, and takes remote access. She pays in gift cards.\nWhere it could have stopped: At the pop-up. Microsoft and Apple never put a phone number in a warning, and a pop-up cannot lock a computer.\nThe signal most people miss: The instruction not to restart. A real warning survives one; this one does not. Restarting breaks the stage set.\n\nWHAT TO SAY\n- To any cold caller: I do not take support calls I did not make. I am hanging up now. Then hang up; do not argue, the caller has a rehearsed answer for every fact.\n- A pop-up number: do not call it. Close the browser; if it will not close, restart.\n- Worried? Call the company's real number yourself, from its official site.\n\nCOMMON MISTAKE: Staying on the line to be polite. Time is the caller's strategy, and hanging up costs you nothing if you are wrong.\n\nLESSON 2 \u2014 THE TRUTH\nNobody monitors your home PC. Microsoft and Apple never call you.\nReal support never cold-calls, never asks for remote access out of nowhere, and never takes gift cards. A gift card request is not a payment method; it is the diagnosis.\nEvent Viewer warnings are normal noise. Windows logs them constantly, on healthy machines, by design. An entry records something routine, not an infection.\nYour IP was flagged is meaningless. They do not know your IP; they dial thousands of numbers.\n\nCASE BREAKDOWN: THE REFUND\nWhat happened: After paying once, Tom gets a second call: the company is closing and will refund him. On screen, his bank balance jumps. Told too much was sent, he wires back the difference. The refund was a transfer staged between his own accounts.\nWhere it could have stopped: At the premise. A company that took gift cards is not refunding his bank, and a refund never requires you to send money first.\nThe signal most people miss: The balance was real; the movement was between his own accounts.\n\nTHE RULE\nHang up. Worried? Call the real number yourself, from the official site.\n\nIF YOU GAVE ACCESS: Disconnect from the internet, have the machine professionally cleaned, change passwords typed since then from a clean device, and call your bank.\n\nCOMMON MISTAKE: Testing the caller with questions only a real technician would know. The script anticipates them. The test is who started the contact.\n\nHANDS-ON EXERCISE\nYour phone rings. This is Microsoft security. Your computer sent error reports. We must check it now or your internet is cut.\nDecision points: He names a real company; does that clear him? No; naming Microsoft costs nothing. He asks you to open Event Viewer just to look; harmless? No; that is step 2.\nCorrect path: Say the script line and hang up. Nothing given, nothing installed.\n\nKNOWLEDGE CHECK\n[CHECK]\nQ: A pop-up says your computer is locked, with a number. What do you do?\nA: Call it; a lock is an emergency\nB: Close the browser or restart; never call it\nC: Pay the fee so it unlocks\nANSWER: B\nFEEDBACK: Microsoft and Apple never show pop-up phone numbers. Calling is tempting, but the lock is a browser page; restarting ends it.\n[/CHECK]\n[CHECK]\nQ: A caller shows you dozens of Event Viewer warnings. What do they prove?\nA: Your computer is infected\nB: Hackers have been active on your machine\nC: Nothing; warnings like these are normal on healthy computers\nANSWER: C\nFEEDBACK: Event Viewer logs routine warnings on every machine. Infection is the tempting reading, but the same screen appears on a new computer.\n[/CHECK]\n[CHECK]\nQ: You gave a caller remote access and paid by gift card. What now?\nA: Wait; access ended at the call\nB: Disconnect the machine, change passwords from a clean device, have it cleaned, and call your bank\nC: Delete the tool and carry on\nANSWER: B\nFEEDBACK: Assume passwords typed since the access are burned. Waiting is tempting, but tools can outlast the call.\n[/CHECK]\n\nKEY TAKEAWAYS\n- Microsoft, Apple, and your provider never cold-call you.\n- Event Viewer warnings are normal noise, evidence of nothing.\n- Remote access plus gift cards, wire, or a repayable refund is the scam.\n- Hang up, and never call a number shown in a pop-up.\n\nGLOSSARY\nCold call - A call you did not request.\nEvent Viewer - A built-in Windows log of routine notices and warnings.\nRemote access tool - Software letting someone else control your computer.\nPop-up - A window over your screen staging a fake warning.\nGift card payment - Untraceable payment scammers demand.\nIP address - Your connection address, not your identity.\n\nFURTHER READING\nFTC: https://consumer.ftc.gov\nReport fraud: https://reportfraud.ftc.gov\nFBI IC3: https://www.ic3.gov\n\nCERTIFICATION ALIGNMENT\nSupports: CompTIA Security+ (SY0-701) Domain 2 \u2014 vishing and pretexting.\nAlignment means this module teaches the knowledge these certifications test in this area. Completing it does not by itself earn any certification \u2014 vendor exams are taken separately through the certification body." }

/* ---------- module reader + knowledge checks ---------- */
let QUIZZES = [];

function parseQuiz(block) {
  const q = { q: "", opts: {}, answer: "", feedback: "" };
  let cur = null;
  block.split("\n").forEach(raw => {
    const ln = raw.trim();
    const m = ln.match(/^([A-D]):\s*(.*)$/);
    if (ln.indexOf("Q:") === 0) { q.q = ln.slice(2).trim(); cur = "q"; }
    else if (ln.indexOf("ANSWER:") === 0) { q.answer = ln.slice(7).trim(); cur = "answer"; }
    else if (ln.indexOf("FEEDBACK:") === 0) { q.feedback = ln.slice(9).trim(); cur = "feedback"; }
    else if (m && cur !== "feedback") { q.opts[m[1]] = m[2].trim(); cur = "opt"; }
    else if (cur === "feedback" && ln) { q.feedback += " " + ln; }
    else if (cur === "q" && ln) { q.q += " " + ln; }
  });
  if (!q.q || !q.answer || !q.opts[q.answer]) return null;
  return q;
}

function quizHtml(q) {
  const idx = QUIZZES.length;
  QUIZZES.push(q);
  let h = '<div class="quiz"><div class="quiz-q">KNOWLEDGE CHECK</div>' +
    '<p class="quiz-question">' + q.q + '</p>';
  Object.keys(q.opts).sort().forEach(L => {
    h += '<button type="button" class="btn qopt" data-quiz="' + idx + '" data-letter="' + L + '">' +
      L + ". " + q.opts[L] + "</button>";
  });
  return h + '<div class="qfb" hidden></div></div>';
}

/* Body text -> HTML. The body is already HTML-escaped by
   getModuleBody, so text segments drop in as-is (pre-wrap keeps the
   line structure); [CHECK] blocks become interactive quizzes. The
   body's first line repeats the module title (shown as the h2) when
   the second line opens MODULE OVERVIEW — drop it there. */
function bodyToHtml(escaped) {
  QUIZZES = [];
  let lines = escaped.split("\n");
  if (lines.length > 1 && lines[1].trim().indexOf("MODULE OVERVIEW") === 0)
    lines = lines.slice(1);
  const chunks = lines.join("\n").split("[CHECK]");
  let html = chunks[0];
  for (let i = 1; i < chunks.length; i++) {
    const end = chunks[i].indexOf("[/CHECK]");
    if (end < 0) { html += "[CHECK]" + chunks[i]; continue; }
    const q = parseQuiz(chunks[i].slice(0, end));
    html += (q ? quizHtml(q) : chunks[i].slice(0, end)) + chunks[i].slice(end + "[/CHECK]".length);
  }
  return html;
}

function wireQuizzes() {
  app().querySelectorAll(".qopt").forEach(btn => {
    btn.addEventListener("click", () => {
      const quiz = QUIZZES[+btn.dataset.quiz];
      if (!quiz) return;
      const box = btn.closest(".quiz");
      if (!box || box.dataset.done) return;
      box.dataset.done = "1";
      box.querySelectorAll(".qopt").forEach(b => {
        b.disabled = true;
        if (b.dataset.letter === quiz.answer) b.classList.add("right");
        else if (b === btn) b.classList.add("wrong");
      });
      const fb = box.querySelector(".qfb");
      fb.hidden = false;
      fb.innerHTML = (btn.dataset.letter === quiz.answer ? "<b>Correct.</b> " : "<b>Not quite.</b> ") +
        quiz.feedback;
    });
  });
}

function renderModule(id) {
  const entry = CONTENT_MANIFEST.find(e => e.id === id);
  if (!entry || !isUnlocked(id)) { renderUpgrade(id); return; }
  const body = getModuleBody(entry);
  app().innerHTML =
    '<div class="card"><div class="tag">📖 COURSE MODULE</div>' +
    "<h2>" + escapeHtml(entry.title) + "</h2>" +
    (body === null
      ? '<div class="warn">This module failed to load — the premium pack may be corrupt. Try re-entering your license key.</div>'
      : '<div class="module-body protected-content">' + bodyToHtml(body) + "</div>") +
    '<button class="btn primary mt" onclick="renderHome()">← BACK</button></div>';
  wireQuizzes();
  window.scrollTo(0, 0);
  focusScreen();
}

function uiCourseRow(id) {
  if (isUnlocked(id)) renderModule(id); else renderUpgrade(id);
}

/* ---------- license UI ---------- */
async function uiUnlock() {
  const str = document.getElementById("keyinput").value;
  const remember = document.getElementById("remember").checked;
  S.licenseMsg = "Checking key..."; renderHomeKeep();
  try {
    await unlockFromKey(str);
    /* A refused write (quota, private mode) must not fail silently —
       the session is still unlocked in memory; say so. */
    let saveNote = "";
    if (remember) {
      try { localStorage.setItem(CONFIG.LICENSE_STORAGE_KEY, str.trim()); }
      catch (e) { saveNote = " (Note: this browser refused to store the key — you stay unlocked for this session only.)"; }
    }
    else { try { localStorage.removeItem(CONFIG.LICENSE_STORAGE_KEY); } catch (e) {} }
    S.licenseMsg = "Full course unlocked — all 46 modules. Welcome." + saveNote;
  } catch (e) { S.licenseMsg = e.message; }
  renderHome();
}
/* re-render home but keep the typed key in place while checking */
function renderHomeKeep() {
  const v = document.getElementById("keyinput") ? document.getElementById("keyinput").value : "";
  const c = document.getElementById("remember") ? document.getElementById("remember").checked : false;
  renderHome();
  const ki = document.getElementById("keyinput");
  if (ki) { ki.value = v; document.getElementById("remember").checked = c; }
}

  renderHome();
}

<script>
"use strict";
/* ================================================================
   HackProof content protection — shared snippet (deterrent layer).
   Scoped to .protected-content containers only: text selection is
   off via CSS; copy/cut/context-menu/dragstart are intercepted with
   a brief polite notice. Paste is NEVER intercepted (students paste
   license keys and certificate codes into form fields), form fields
   are never blocked, and screen readers are unaffected. This is a
   deterrent, not a vault: it cannot stop view-source or screenshots,
   and the product never claims otherwise.
   ================================================================ */
(function(){
  function inProtected(t){ return !!(t && t.closest && t.closest(".protected-content")); }
  function inField(t){ return !!(t && t.closest && t.closest("input, textarea, select, [contenteditable='true']")); }
  var lastNotice = 0;
  function notice(){
    var now = Date.now(); if(now - lastNotice < 2500) return; lastNotice = now;
    var d = document.createElement("div");
    d.className = "copy-notice"; d.setAttribute("role","status");
    d.textContent = "Copying is disabled for course content.";
    document.body.appendChild(d);
    setTimeout(function(){ d.remove(); }, 2600);
  }
  ["copy","cut"].forEach(function(type){
    document.addEventListener(type, function(e){
      if(inProtected(e.target) && !inField(e.target)){ e.preventDefault(); notice(); }
    }, true);
  });
  document.addEventListener("contextmenu", function(e){
    if(inProtected(e.target) && !inField(e.target)) e.preventDefault();
  }, true);
  document.addEventListener("dragstart", function(e){
    if(inProtected(e.target) && !inField(e.target)) e.preventDefault();
  }, true);
})();
</script>

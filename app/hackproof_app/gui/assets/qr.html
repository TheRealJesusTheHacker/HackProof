<!DOCTYPE html>
<!--
  HackProof app asset — payment QR display for the native Buy screen.
  The native side loads this page in a small web view and calls
  renderPaymentQR(bip21Text) once the order exists. Rendering uses the
  product's own clean-room encoder (qr.js, the app copy of the
  website's), so the code on screen is identical to the website's.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  html, body { margin: 0; padding: 0; background: #0c130d; height: 100%; }
  body { display: flex; align-items: center; justify-content: center; }
  img { width: 208px; height: 208px; border: 8px solid #fff;
        border-radius: 12px; background: #fff; }
  .empty { color: #7d927f; font-family: "Segoe UI", sans-serif;
           font-size: 13px; text-align: center; padding: 16px; }
</style>
</head>
<body>
<div class="empty" id="placeholder">Your payment QR code will appear here.</div>
<img id="qr" alt="Bitcoin payment QR code" style="display:none">
<script src="qr.js"></script>
<script>
"use strict";
function renderPaymentQR(text) {
  try {
    var img = document.getElementById("qr");
    img.src = hpQRDataURL(text, 5, 2);
    img.style.display = "block";
    document.getElementById("placeholder").style.display = "none";
    return true;
  } catch (e) {
    document.getElementById("placeholder").textContent =
      "QR code unavailable — copy the address and amount instead.";
    return false;
  }
}
</script>
</body>
</html>

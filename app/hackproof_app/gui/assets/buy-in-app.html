<!DOCTYPE html>
<!--
  HackProof app asset — where "Get premium" links land inside
  the app. Buying is the native My Premium screen (the website's
  buy page does not ship in the app edition); this page says so
  in one breath and names the one tap that gets there. The
  bundler rewrites the site pages' buy links to point here.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Get Premium — HackProof</title>
<style>
  body { margin: 0; background: #060a07; color: #e8f2ea;
         font-family: "Segoe UI", system-ui, sans-serif; }
  main { max-width: 560px; margin: 12vh auto 0; padding: 32px;
         background: #0c130d; border: 1px solid #1e3323;
         border-radius: 12px; text-align: center; }
  h1 { font-size: 22px; margin: 0 0 10px; }
  h1 span { color: #2ee06f; }
  p { color: #9db3a4; line-height: 1.6; }
  p strong { color: #e8f2ea; }
</style>
</head>
<body>
<main>
  <h1>Premium is bought <span>inside the app</span></h1>
  <p>Tap <strong>My Premium</strong> in the menu on the left. That's
     where you check out with Bitcoin and where your license key
     lives — the key is your account, and entering it there unlocks
     the full course and the final exam in this app.</p>
</main>
</body>
</html>

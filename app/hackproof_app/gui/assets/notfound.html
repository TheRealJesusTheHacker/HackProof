<!DOCTYPE html>

  state to explain, never a raw browser error to show.
-->

<head>
<meta charset="UTF-8">
<title>Not in this copy — HackProof</title>
<style>
  body { margin: 0; background: #060a07; color: #e8f2ea;
         font-family: "Segoe UI", system-ui, sans-serif; }
  main { max-width: 560px; margin: 12vh auto 0; padding: 32px;
         background: #0c130d; border: 1px solid #1e3323;
         border-radius: 12px; text-align: center; }
  h1 { font-size: 22px; margin: 0 0 10px; }
  h1 span { color: #2ee06f; }
  p { color: #9db3a4; line-height: 1.6; }
</style>
</head>
<body>
<main>
  <h1>This page isn't in <span>this copy</span> of HackProof</h1>
  <p>The page you're looking for isn't part of this edition's course
     bundle. Use the sections on the left to keep learning — and if
     you expected this page here, a newer download of HackProof may
     include it.</p>
</main>
</body>
</html>

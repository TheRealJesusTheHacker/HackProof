name: build-app-windows

# Builds the HackProof Windows app when an app release is published:
#   * app releases are tagged "app-vX.Y.Z" — the job runs ONLY for
#     those tags, so site/payments releases never trip it, and the
#     tag is checked against hackproof_app.__version__ (a tag that
#     disagrees with the code never ships)
#   * bundles the course website from the release tree
#     (app/tools/bundle_site.py) — the app always carries the site
#     exactly as released
#   * runs the app test suite (GUI tests run offscreen)
#   * builds THE HackProof.exe with PyInstaller — one file: the app,
#     the self-install engine, the setup/uninstall flows
#   * smoke-tests the built exe with --self-check (import census)
#     and --self-check-qt (builds the real main window AND a web
#     view — importing QtWebEngine is not proof its process and
#     resources shipped), and greps the PyInstaller warn file for
#     the lazy-import watchlist
#   * attaches HackProof.exe and SHA256SUMS.txt to the release
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    if: startsWith(github.ref_name, 'app-v')
    runs-on: windows-latest
    steps:
      # Actions pinned to full commit SHAs (the repo's supply-chain
      # convention): a moved tag must never change what a release
      # build runs. SHAs verified against upstream on 2026-10-19.
      - name: Check out the release tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Check the release tag matches the app version
        run: |
          $tag = "${{ github.ref_name }}"
          $init = Get-Content app/hackproof_app/__init__.py -Raw
          if ($init -notmatch '__version__\s*=\s*"([^"]+)"') {
            Write-Host "Could not read __version__ from app/hackproof_app/__init__.py."
            exit 1
          }
          $code = $Matches[1]
          if ("app-v$code" -ne $tag) {
            Write-Host "Release tag '$tag' does not match hackproof_app.__version__ '$code' (expected tag 'app-v$code')."
            exit 1
          }
          Write-Host "Release tag $tag matches hackproof_app.__version__ $code."

      - name: Install dependencies
        run: pip install -r app/packaging/requirements-ci.txt

      - name: Bundle the course website into the app
        run: python app/tools/bundle_site.py

      - name: Run the app test suite (GUI offscreen)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest app/tests -q

      - name: Build HackProof.exe (the whole product, one file)
        run: pyinstaller app/packaging/HackProof.spec --noconfirm

      - name: Check the build for missing lazy imports (warn file)
        run: |
          $warn = "build\HackProof\warn-HackProof.txt"
          if (-not (Test-Path $warn)) {
            Write-Host "PyInstaller warn file not found at $warn — cannot verify the lazy-import watchlist."
            exit 1
          }
          $watchlist = "PySide6.QtWebEngineWidgets", "PySide6.QtWebEngineCore", "PySide6.QtNetwork", "hackproof_app.gui.webview"
          $hits = Select-String -Path $warn -Pattern ($watchlist -join "|")
          if ($hits) {
            Write-Host "PyInstaller could not find modules on the lazy-import watchlist:"
            $hits | ForEach-Object { Write-Host $_.Line }
            exit 1
          }
          Write-Host "No watchlist modules missing from the build."

      - name: Smoke-test the built exe (--self-check)
        run: |
          $proc = Start-Process -FilePath "dist\HackProof.exe" -ArgumentList "--self-check" -Wait -PassThru
          if ($proc.ExitCode -ne 0) {
            Write-Host "HackProof.exe --self-check failed with exit code $($proc.ExitCode)."
            exit 1
          }
          Write-Host "HackProof.exe --self-check passed."

      # Constructing the real main window AND a web view offscreen:
      # a build whose browser would die on launch fails here.
      - name: Smoke-test the built exe's GUI stack (--self-check-qt, offscreen)
        env:
          QT_QPA_PLATFORM: offscreen
          QTWEBENGINE_CHROMIUM_FLAGS: "--disable-gpu --no-sandbox"
        run: |
          $proc = Start-Process -FilePath "dist\HackProof.exe" -ArgumentList "--self-check-qt" -Wait -PassThru
          if ($proc.ExitCode -ne 0) {
            Write-Host "HackProof.exe --self-check-qt failed with exit code $($proc.ExitCode)."
            exit 1
          }
          Write-Host "HackProof.exe --self-check-qt passed."

      - name: Generate SHA256SUMS.txt for the release assets
        run: |
          $hash = (Get-FileHash "dist/HackProof.exe" -Algorithm SHA256).Hash.ToLower()
          "$hash  HackProof.exe" | Out-File -Encoding ascii dist/SHA256SUMS.txt
          Get-Content dist/SHA256SUMS.txt

      - name: Attach the exe and checksums to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload ${{ github.ref_name }} dist/HackProof.exe dist/SHA256SUMS.txt --clobber
